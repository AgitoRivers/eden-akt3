<style>
/* Deck Glass Noir: Bild randlos, Figuren so gross wie moeglich links, Rauchglas-Messenger rechts, Champagner als Akzent. */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--perle);font:var(--t-text)/1.5 var(--f-ui);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--akz);outline-offset:2px}
svg.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{position:fixed;inset:0;overflow:hidden}
/* Buehne */
.bgl{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .9s ease}
.bgl.an{opacity:1}
#figuren{position:absolute;inset:0;pointer-events:none}
.fig{position:absolute;bottom:-4vh;height:calc(104vh - 150px);transform:translateX(-50%);transition:left .55s ease,height .45s ease,filter .4s ease,opacity .4s ease;user-select:none}
.fig.leise{height:calc(94vh - 150px);bottom:0;filter:brightness(.55) saturate(.8)}
.fig.weg{opacity:0}
#vign{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(7,8,11,0) 45%,rgba(7,8,11,.42) 100%),linear-gradient(0deg,rgba(7,8,11,.35) 0,rgba(7,8,11,0) 25%)}
#app:not([data-status="szene"]) #vign{background:linear-gradient(0deg,rgba(7,8,11,.55),rgba(7,8,11,.2) 60%)}

/* HUD */
/* Eine Leiste (Duc 30.10.2026): links die Zeit, rechts die Status-Knoepfe aus eden-ui */
#zeitpille{position:absolute;top:var(--rand);left:var(--rand);display:flex;align-items:center;gap:var(--a3);padding:var(--a15) var(--a2) var(--a15) var(--a4);border-radius:var(--r-rund);z-index:5}
/* Im Ort-Panel steht das Geld dort; ohne Ziel und Geld ragt die Leiste nicht ins Panel */
#app:has(.ort-panel) #zeitpille .ziel,#app:has(.ort-panel) #zeitpille .geld{display:none}
#zeitinhalt{display:flex;align-items:center;gap:var(--a35)}
#zeitpille .uhr-skip{display:grid;place-items:center;padding:var(--a1);border:0;background:none;color:var(--akz);cursor:pointer;border-radius:var(--r-rund)}
#zeitpille .uhr-skip:hover{color:var(--perle)}
#zeitpille .uhr-skip:disabled{opacity:.4;cursor:default}
#zeitpille:has(.ui-infokarte){z-index:9}
#zeitpille .name{font-size:var(--t-gross);color:var(--akz)}
#zeitpille .trenn{width:1px;height:22px;background:var(--linie-n)}
.hinw{display:flex;flex-wrap:wrap;gap:var(--a15);margin-top:var(--a2)}
.hinw span{display:inline-flex;align-items:center;gap:var(--a1);font-size:var(--t-klein);padding:var(--pille-klein);border-radius:var(--r-rund);border:1px solid rgba(216,189,134,.5);color:var(--akz);white-space:nowrap}
.hinw span.minus{border-color:rgba(217,161,152,.6);color:var(--schlecht)}
.vorrat{display:grid;grid-template-columns:1fr;gap:var(--a35)}
.vorrat .v{border:1px solid var(--linie-n);border-radius:var(--r-mittel);padding:var(--karte-pad);background:rgba(243,238,228,.05)}
.vorrat .v b{display:flex;justify-content:space-between;gap:var(--a3);font-size:var(--t-text)}
.vorrat .v .bar{height:6px;border-radius:var(--r-rund);background:rgba(243,238,228,.12);margin:var(--a2) 0}
.vorrat .v .bar i{display:block;height:100%;border-radius:var(--r-rund);background:var(--akz)}
.vorrat .v p{margin:0;color:var(--perle-leise);font-size:var(--t-info);line-height:1.5}
.dots{display:flex;gap:var(--a15);align-items:center}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(243,238,228,.28)}
.dots i.war{background:var(--perle)} .dots i.ist{width:22px;border-radius:var(--r-rund);background:var(--akz)}
#zeitpille .was{color:var(--perle-leise);max-width:28ch;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#relkarte{position:absolute;bottom:92px;left:var(--rand);padding:var(--a3) var(--a4);border-radius:var(--r-karte);display:flex;flex-direction:column;gap:var(--a25);z-index:5;min-width:200px}
#relkarte:empty{display:none}
.relz{display:grid;grid-template-columns:1fr auto;gap:2px var(--a35);align-items:center;font-size:var(--t-klein)}
.relz b{grid-column:1/-1;font-family:var(--f-name);font-weight:700;color:var(--akz);font-size:var(--t-text)}
.relz span{color:var(--perle-leise)}
.bezring{display:flex;align-items:center;gap:var(--a2);min-width:0}
.bezring.v .ui-ring{--ui-farbe:var(--akz2);color:var(--akz2)} .bezring.b .ui-ring{--ui-farbe:var(--begehren);color:var(--begehren)}
.bezring .ui-ring::before{background:rgba(7,8,11,.88)}
.bezring.klein .ui-ring{width:var(--a6);height:var(--a6)} .bezring.klein .ui-ring .ui-ic{width:16px;height:16px}
.bezwort{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.bezring .bezwort small{font:600 var(--t-mini) var(--f-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--perle-dim)}
.bezring .bezwort b{font:600 var(--t-info) var(--f-ui);color:var(--perle);white-space:nowrap}
.punkte{display:flex;gap:var(--a1)}
.punkte u{width:8px;height:8px;border-radius:50%;background:rgba(243,238,228,.22);text-decoration:none}
.punkte.v u.an{background:var(--akz2)} .punkte.b u.an{background:var(--begehren)}
.punkte.v u[style]{background:linear-gradient(90deg,var(--akz2) var(--f),rgba(243,238,228,.22) var(--f))}
.punkte.b u[style]{background:linear-gradient(90deg,var(--begehren) var(--f),rgba(243,238,228,.22) var(--f))}
#dock{position:absolute;left:var(--rand);bottom:var(--rand);display:flex;gap:var(--a2);padding:var(--a2);border-radius:var(--r-rund);z-index:6}
#dock button{position:relative;width:48px;height:48px;border-radius:50%;border:0;background:rgba(243,238,228,.08);display:grid;place-items:center}
#dock button:hover{background:rgba(243,238,228,.16)}
#dock button[aria-pressed="true"]{background:var(--akz);color:var(--ink)}
#dock button b{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 var(--a1);border-radius:var(--r-taste);background:var(--akz);color:var(--ink);font:600 var(--t-mini)/18px var(--f-ui)}

/* Chat */
#chat{position:absolute;top:var(--rand);right:var(--rand);bottom:var(--rand);width:var(--chat-b);border-radius:var(--r-panel);display:flex;flex-direction:column;overflow:hidden;z-index:7;transition:transform .45s ease,opacity .35s ease}
#app:not([data-status="szene"]) #chat,#app.chat-zu #chat{transform:translateX(calc(100% + 40px));opacity:0;pointer-events:none}
#chatkopf{display:flex;align-items:center;gap:var(--a3);padding:var(--a35) var(--a4);border-bottom:1px solid var(--linie-n)}
.avs{display:flex}
.av{width:40px;height:40px;border-radius:50%;flex:none;background-color:var(--flaeche2);background-size:300% auto;background-position:50% 4%;background-repeat:no-repeat;border:1px solid var(--linie)}
.avs .av+.av{margin-left:-12px}
#chatkopf .t{flex:1;min-width:0}
#chatkopf .t b{display:block;font-family:var(--f-name);font-weight:750;font-size:var(--t-gross);letter-spacing:-.02em;color:var(--akz);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chatkopf .t small{color:var(--perle-leise);font-size:var(--t-klein)}
.ring{--p:1;width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;background:conic-gradient(var(--akz) calc(var(--p)*100%),rgba(243,238,228,.14) 0)}
.ring span{width:34px;height:34px;border-radius:50%;background:rgba(7,8,11,.82);display:grid;place-items:center;font:500 var(--t-klein) var(--f-zahl)}
.kopfknopf{border:0;background:transparent;color:var(--perle-leise);width:34px;height:34px;border-radius:50%;display:grid;place-items:center}
.kopfknopf:hover{background:rgba(243,238,228,.1);color:var(--perle)}
.kopfknopf.an{color:var(--akz)}
#verlauf{flex:1;min-height:0;overflow-y:auto;padding:var(--a4);display:flex;flex-direction:column;gap:var(--a3);scrollbar-width:thin;scrollbar-color:rgba(243,238,228,.2) transparent}
.intro{border:1px solid var(--linie);border-radius:var(--r-karte);padding:var(--karte-pad);background:rgba(7,8,11,.35)}
.intro .name{font-size:var(--t-unter);color:var(--perle);display:block;line-height:1.15}
.intro small{color:var(--akz);letter-spacing:.08em;text-transform:uppercase;font-size:var(--t-mini)}
.intro p{margin:var(--a2) 0 0;color:var(--perle-leise);font-size:var(--t-info)}
.intro .frage{color:var(--akz)}
.msg{display:flex;gap:var(--a25);align-items:flex-end}
.msg .av{width:30px;height:30px}
.blase{padding:var(--a25) var(--a35);border-radius:var(--r-karte) var(--r-karte) var(--r-karte) var(--r-taste);background:rgba(243,238,228,.09);max-width:88%;min-width:0}
.blase .wer{display:block;font-family:var(--f-name);font-weight:700;font-size:var(--t-klein);color:var(--akz);margin-bottom:2px}
.blase p{margin:0 0 var(--a15);color:var(--perle-leise)}
.blase p:last-child{margin-bottom:0}
.rede{color:var(--rede);font-weight:500}
em.ged{font-style:italic;color:var(--akz2)}
.msg.ich{justify-content:flex-end}
/* Ducs Profilbild (17.10.2026): fertig zugeschnittenes Quadrat, daher cover statt Sprite-Ausschnitt */
.av.ich{background-size:cover;background-position:center;display:grid;place-items:center;font:700 var(--t-klein) var(--f-name);color:var(--akz)}
.av.gross{width:96px;height:96px;font-size:var(--t-kopf)}
.profilwahl{display:flex;align-items:center;gap:var(--a35);border:0;background:transparent;padding:0;text-align:left;color:var(--perle)}
.profilwahl .av{width:64px;height:64px;font-size:var(--t-unter);border-color:var(--akz)}
.profilwahl b{display:block;font-family:var(--f-name);font-weight:700}
.profilwahl small,.kopfzeile .profilwahl small{color:var(--perle-leise);font-size:var(--t-klein);text-transform:none;letter-spacing:0}
.profilwahl:hover .av{box-shadow:0 0 0 3px rgba(216,189,134,.35)}
.karte .profilwahl .av{width:40px;height:40px;font-size:var(--t-text)}
.stgitter{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:var(--a25)}
.stgitter button{border:1px solid var(--linie-n);background:rgba(7,8,11,.35);border-radius:var(--r-mittel);padding:var(--a15);display:flex;flex-direction:column;gap:var(--a1);align-items:center;color:var(--perle-leise);font-size:var(--t-mini);min-width:0}
.stgitter button:hover{border-color:var(--akz)}
.stgitter img{width:100%;aspect-ratio:1;object-fit:cover;object-position:50% 15%;border-radius:var(--r-taste)}
.stgitter span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hochladen{display:flex;flex-direction:column;align-items:center;gap:var(--a25);padding:var(--a5);border:1px dashed var(--linie);border-radius:var(--r-karte);color:var(--perle-leise);text-align:center}
.hochladen.drueber{border-color:var(--akz);background:rgba(216,189,134,.08)}
.zuschnitt{display:flex;flex-wrap:wrap;gap:var(--a5);align-items:flex-start}
.cropb{position:relative;width:min(320px,100%);aspect-ratio:1;overflow:hidden;border-radius:var(--r-mittel);background:#000;cursor:grab;touch-action:none;user-select:none}
.cropb:active{cursor:grabbing}
.cropb img{position:absolute;max-width:none;pointer-events:none}
.cropb::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 999px rgba(7,8,11,.62);border:2px solid var(--akz);pointer-events:none}
.cropvor{display:flex;flex-direction:column;gap:var(--a35);min-width:180px}
.cropvor canvas{border-radius:50%;border:1px solid var(--linie)}
.cropvor .msg.ich .blase{font-size:var(--t-info)}
.cropvor small{color:var(--perle-dim);font-size:var(--t-klein)}
.cropzoom{display:flex;align-items:center;gap:var(--a25);width:min(320px,100%)}
.cropzoom input{flex:1;accent-color:var(--akz)}
.knopfzeile{display:flex;flex-wrap:wrap;gap:var(--a2)}
.ausliste{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:var(--a2)}
.ausliste button{display:flex;align-items:center;gap:var(--a25);border:1px solid var(--linie-n);background:rgba(243,238,228,.05);border-radius:var(--r-mittel);padding:var(--karte-pad-klein);text-align:left;min-width:0}
.ausliste button:hover{border-color:var(--akz)}
.ausliste .av{width:48px;height:48px}
.ausliste span{display:flex;flex-direction:column;min-width:0}
.ausliste b{font-weight:600;font-size:var(--t-info);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ausliste small{color:var(--perle-dim);font-size:var(--t-mini)}
.msg.ich .blase{background:var(--akz);color:var(--ink);border-radius:var(--r-karte) var(--r-karte) var(--r-taste) var(--r-karte)}
.msg.ich .blase p,.msg.ich .rede{color:var(--ink)}
.chipzeile{margin:-4px 0 0 40px;display:flex;flex-wrap:wrap;gap:var(--a15)}
.miniship{font-size:var(--t-mini);padding:var(--pille);border-radius:var(--r-rund);border:1px solid var(--linie-n);color:var(--perle-dim)}
.miniship.ok{border-color:rgba(157,185,214,.5);color:var(--akz2)}
.wurf{align-self:center;display:flex;align-items:center;gap:var(--a3);padding:var(--karte-pad-klein);border-radius:var(--r-mittel);border:1px solid var(--linie);background:rgba(7,8,11,.45);font-size:var(--t-klein)}
.wurf .w{width:36px;height:36px;border-radius:var(--r-taste);display:grid;place-items:center;font:600 var(--t-text) var(--f-zahl);background:rgba(243,238,228,.1)}
.wurf b{display:block;font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:var(--t-mini);color:var(--perle-leise)}
.wurf.erfolg .w,.wurf.kritisch .w{background:var(--gut);color:var(--ink)}
.wurf.fehlschlag .w,.wurf.patzer .w{background:var(--schlecht);color:var(--ink)}
.wurf .erg{font-weight:600}
.wurf.erfolg .erg,.wurf.kritisch .erg{color:var(--gut)} .wurf.fehlschlag .erg,.wurf.patzer .erg{color:var(--schlecht)}
.band{align-self:stretch;text-align:center;padding:var(--a25) var(--a35);border-top:1px solid var(--linie);border-bottom:1px solid var(--linie);font-size:var(--t-info);color:var(--perle)}
.band small{display:block;font-size:var(--t-mini);letter-spacing:.18em;text-transform:uppercase;color:var(--akz);margin-bottom:2px}
.folgen{align-self:center;display:flex;flex-wrap:wrap;gap:var(--a15);justify-content:center}
.folgen span{font-size:var(--t-klein);padding:var(--pille);border-radius:var(--r-rund);background:rgba(216,189,134,.14);border:1px solid var(--linie);color:var(--akz)}
.reaktion{align-self:center;display:flex;flex-wrap:wrap;gap:var(--a15);justify-content:center}
.reaktion span{font-size:var(--t-klein);padding:var(--pille);border-radius:var(--r-rund);border:1px solid var(--linie-n);color:var(--perle-leise);background:rgba(7,8,11,.35)}
.reaktion span.gut{color:var(--gut,var(--pfad-h));border-color:rgba(159,211,168,.35)}
.reaktion span.schlecht{color:var(--schlecht);border-color:rgba(230,140,120,.35)}
.reaktion span.wert{color:var(--akz);background:rgba(216,189,134,.14);border-color:var(--linie)}
.prolog{width:min(760px,100%);display:flex;flex-direction:column;gap:var(--a4);padding:var(--a5) var(--a6);border-radius:var(--r-karte)}
.prolog p{margin:0;color:var(--perle);font-size:var(--t-gross);line-height:1.6;max-width:65ch}
.prolog p.letzte{font-family:var(--f-name);font-weight:750;font-size:var(--t-unter);color:var(--akz)}
.prolog .ziel{font-size:var(--t-info);color:var(--akz);border-top:1px solid var(--linie);padding-top:var(--a35)}
#zeitpille .ziel{color:var(--akz);font-size:var(--t-klein);white-space:nowrap}
.tippt{display:flex;gap:var(--a1);padding:var(--a3) var(--a4);border-radius:var(--r-karte) var(--r-karte) var(--r-karte) var(--r-taste);background:rgba(243,238,228,.09);align-self:flex-start;margin-left:40px}
.tippt i{width:7px;height:7px;border-radius:50%;background:var(--perle-leise);animation:hop 1.1s infinite ease-in-out}
.tippt i:nth-child(2){animation-delay:.15s}.tippt i:nth-child(3){animation-delay:.3s}
@keyframes hop{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}
/* Vorschlaege (17.10.): Ideen sind jetzt kurze Romanabsaetze (70-110 Woerter, Absaetze mit Leerzeile) - Liste scrollt */

/* Laden und Kombuese (UX-Paket 03.11.2026): die Antworten stehen direkt unter der Sprechblase, wie in VA-11 Hall-A.
   Ist ein Reiter offen, wandert das Gespraech nach links neben das Panel. Grundwerte von .ort-* in eden-combat.css */
.ort .ort-gespraech{position:absolute;top:13%;left:calc(56% + 13vh);width:min(380px,calc(96% - 56% - 13vh));display:flex;flex-direction:column;gap:var(--a2);z-index:3}

.ort .ort-gespraech .ort-wahl{padding:var(--a25);gap:var(--a1)}
.ort .ort-gespraech .ort-wahl button{font-size:var(--t-text);padding:var(--a2) var(--a3)}
/* Reiter offen (Duc 03.11.2026): die Figur steht mittig zwischen Gespraech links und Panel rechts, nie dahinter.
   Bis acht Waren immer volle Reihen: bis 4 = 2 Spalten, 5-6 = 3, 7-8 = 4 (zwei Reihen). Das Panel ist nur so breit wie
   die Spalten, damit mehr Figur zu sehen ist. Ab neun Waren das breite Panel mit Scrollen */
.ort.mit-panel{--panel-b:min(860px,58%)}
.ort.mit-panel.sp2{--panel-b:min(440px,27%)} .ort.mit-panel.sp3{--panel-b:min(640px,36%)} .ort.mit-panel.sp4{--panel-b:min(820px,45%)}
.ort.sp2 .inv{grid-template-columns:repeat(2,1fr)} .ort.sp3 .inv{grid-template-columns:repeat(3,1fr)} .ort.sp4 .inv{grid-template-columns:repeat(4,1fr)}
.ort.mit-panel .ort-panel{width:var(--panel-b)}
.ort.mit-panel .ort-figur{left:calc((100% + 4% + 340px - var(--panel-b) - 3%) / 2);transition:left .25s ease-out}
.ort[class*=" sp"] .inv{gap:var(--a2)}
.ort[class*=" sp"] .ware{padding:var(--a25);gap:var(--a1)}
.ort[class*=" sp"] .ware b{font-size:var(--t-info)}

/* Hinweise und Ebenen */

#buehnenkarte:empty{display:none}
.szk{--szk-kurve:cubic-bezier(.16,1,.3,1);position:absolute;inset:0;z-index:40;display:flex;align-items:center;overflow:hidden;animation:szkRein .55s ease-out both}

.szk-bild{position:absolute;inset:0;background:var(--ink) center/cover no-repeat;animation:szkBild 9s ease-out both}
.szk-bruecke .szk-schleier{background:linear-gradient(to top,rgba(7,8,11,.92),rgba(7,8,11,.35) 55%,rgba(7,8,11,.55));backdrop-filter:none;-webkit-backdrop-filter:none}

.szk-band::before{top:0}.szk-band::after{bottom:0}
.szk-teil{animation:szkTeil .7s var(--szk-kurve) both;animation-delay:calc(.3s + var(--i,0)*.13s)}
.szk-zeit{font:600 var(--t-klein) var(--f-zahl);letter-spacing:.18em;text-transform:uppercase;color:var(--akz)}
.szk-titel{margin:0;font:750 var(--t-riesig) var(--f-name);letter-spacing:-.02em;color:var(--perle);text-shadow:0 2px 28px rgba(0,0,0,.6)}
.szk-satz{margin:0;max-width:760px;font-size:var(--t-unter);line-height:1.5;color:var(--perle);text-shadow:0 1px 14px rgba(0,0,0,.8)}

.szk-wert.plus .szk-zahl{color:var(--gut)}

.szk-gesten{display:flex;flex-wrap:wrap;gap:var(--a2)}
.szk-geste{display:inline-flex;align-items:center;gap:var(--a1);padding:var(--pille);border-radius:var(--r-rund);border:1px solid var(--linie-n);background:var(--rauch);font-size:var(--t-klein);color:var(--perle)}
.szk-geste.nein{color:var(--perle-dim)}
.szk-weiter{margin-top:var(--a2)}
/* Vorhang (Duc 01.11.2026, Variante C): Balken fahren zu, die Szene bleibt zu sehen, Titel gross unten */
.szk{align-items:flex-end}
.szk::before,.szk::after{content:"";position:absolute;left:0;right:0;height:13vh;background:var(--ink);z-index:1;animation:szkBalken 1s var(--szk-kurve) both}

<body>

<div id="app" data-status="titel">

      <button id="senden" type="submit" aria-label="Send"></button>
    </form>
  </aside>
  <div id="ermhinweis" role="status" hidden><b>You can investigate here.</b> Click <span id="ermhinweis-ic"></span> or press <kbd>E</kbd> to look closer, ask, or secure evidence.
    <button type="button" onclick="ermHinweisWeg()">Got it</button></div>
  <button id="chatauf" class="glas" type="button"><span id="chatauf-ic"></span>Conversation <kbd>P</kbd></button>

  <div id="toast"></div>
  <div id="vmeldung" aria-live="polite"></div>
  <div id="overlay"></div>
</div>

<script>
const DEBUG = location.search.includes("debug=1");
const PHASE = {fruehstueck:"Breakfast", tag:"Midday", nachmittag:"Afternoon", dinner:"Dinner", abend:"Evening", nacht:"Night"};
const FRAGE = {fruehstueck:"How does the day begin?", tag:"How do you spend midday?", nachmittag:"What do you do this afternoon?", dinner:"Where do you eat tonight?", abend:"Where to this evening?", nacht:"How does the night end?"};
const ATTR = {charm:"Charm", empathy:"Empathy", perception:"Perception", cunning:"Cunning", courage:"Courage", strength:"Strength"};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const merk = {lesen(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } },
              schreiben(k, v){ try { localStorage.setItem(k, v); } catch(e){} }};
let V = null, beschaeftigt = false, wartetext = "";
let chatOffen = merk.lesen("eden_chat", "1") === "1";
let STIMME = merk.lesen("eden_stimme", "1") === "1";      // Standard: an (13.10., Duc hoerte nichts)
// Sprechtempo (17.10.2026): Wiedergabe-Geschwindigkeit aller Stimmen, Standard 1,1x. Die Tonhoehe bleibt
// (preservesPitch) - es klingt schneller, nicht nach Mickymaus. Einstellbar im Menue, gemerkt im Browser.
const TEMPO_STD = 1.1, TEMPO_MIN = 0.8, TEMPO_MAX = 1.6;
const tempoKlemmen = v => Math.min(TEMPO_MAX, Math.max(TEMPO_MIN, Math.round((parseFloat(v) || TEMPO_STD) * 20) / 20));
let TEMPO = tempoKlemmen(merk.lesen("eden_tempo", String(TEMPO_STD)));
const laufendeAudios = new Set();
function mitTempo(a){
  a.preservesPitch = a.mozPreservesPitch = a.webkitPreservesPitch = true;
  a.defaultPlaybackRate = a.playbackRate = TEMPO;
  if (window.EdenMusic) EdenMusic.registerSpeech(a);
  laufendeAudios.add(a); a.addEventListener("ended", () => laufendeAudios.delete(a)); a.addEventListener("error", () => laufendeAudios.delete(a));
  return a;
}
function tempoSetzen(v){
  TEMPO = tempoKlemmen(v); merk.schreiben("eden_tempo", String(TEMPO));
  laufendeAudios.forEach(a => { a.defaultPlaybackRate = a.playbackRate = TEMPO; });   // wirkt sofort auf die laufende Zeile
  const w = document.getElementById("tempoWert"); if (w) w.textContent = "×" + TEMPO.toFixed(2);
}
let GESTEN = {offen: false, reiter: "reden", an: null};
function gestenUmschalten(){ GESTEN.offen = !GESTEN.offen; if (GESTEN.offen) ERM.offen = false; zeichnen(); }
// Ermittlung (B3, 17.10.2026): was hier und jetzt geht - nur Aktionen, nie Hinweise auf die Loesung
let ERM = {offen: false};
function ermUmschalten(){ ERM.offen = !ERM.offen; if (ERM.offen){ GESTEN.offen = false; ermHinweisWeg(); } zeichnen(); }
// Einmal je Spielstand (Duc 29.10.2026): beim ersten Mal, dass es in einer Szene etwas zu ermitteln gibt, zeigt eine
// Sprechblase am Investigate-Knopf, dass man hier nachforschen kann. Weg nach Klick auf "Got it" oder sobald das Feld aufgeht.
function ermHinweisSchl(z){ return "eden_erm_hinweis_" + (z && z.id || ""); }
function ermHinweis(z, zeigen){
  const el = $("ermhinweis"); if (!el) return;
  let gesehen = false; try { gesehen = localStorage.getItem(ermHinweisSchl(z)) === "1"; } catch (_) {}
  el.hidden = !(zeigen && !gesehen && chatOffen && !overlay);
}
function ermHinweisWeg(){
  const z = V && V.z; try { localStorage.setItem(ermHinweisSchl(z), "1"); } catch (_) {}
  const el = $("ermhinweis"); if (el) el.hidden = true;
}
function ermitteln(weg){ ERM.offen = false; senden("ermitteln", {weg}, "…"); }
function ermWiderspruch(id, beschuldigen){ ERM.offen = false; senden("widerspruch", {id, beschuldigen}, "…"); }
function ermAktionHtml(a, aussen){
  return `<button class="g erm" type="button" onclick="ermitteln('${a.weg}')" ${beschaeftigt ? "disabled" : ""}>
    <b>${ermIc(a)} ${esc(a.verb)}${a.tipp ? ' <span class="tipp" title="Someone pointed you here">' + uiIc("talk", "klein") + '</span>' : ""}</b><small>${esc(a.text)}</small>${a.kosten ? `<small class="kosten">${uiIc("time", "klein")} ${esc(a.kosten)}</small>` : ""}${a.sperre ? `<small class="kosten">${uiIc("locked", "klein")} ${esc(a.sperre)}</small>` : ""}</button>`;
}
function ermittlungHtml(e){
  const ws = e.widersprueche.map(w => `<div class="angebot">${uiIc("time", "klein")} ${esc(w.codex)}</div><div class="zeile">
    <button class="g" type="button" onclick="ermWiderspruch('${w.id}', false)" ${beschaeftigt ? "disabled" : ""}><b>Ask ${esc(w.name)} about it</b><small>“The timing doesn't add up.”</small></button>
    <button class="g" type="button" onclick="if(confirm('Accuse without proof? They will shut down.'))ermWiderspruch('${w.id}', true)" ${beschaeftigt ? "disabled" : ""}><b>Accuse</b><small>without proof – they shut down</small></button></div>`).join("");
  const akt = e.aktionen.length ? `<div class="gesten">${e.aktionen.map(a => ermAktionHtml(a, false)).join("")}</div>`
    : `<p class="leer" style="margin:0">Nothing to investigate here right now. Other places, other people – or the phone.</p>`;
  const kf = (e.konfrontation || []).length ? `<small class="leer">Confront · only a complete chain makes someone confess – without it, it stays your hunch</small><div class="gesten">${e.konfrontation.map(k => `<button class="g" type="button" onclick="ermKonfront('${k.id}', ${k.oeffentlich && k.id.startsWith("konfront:")})" ${beschaeftigt ? "disabled" : ""}><b>${k.id.startsWith("korrektur:") ? uiIc("back", "klein") : uiIc("confront", "klein")} ${esc(k.text)}</b><small>${k.id.startsWith("korrektur:") ? "öffentliche Korrektur" : k.oeffentlich ? "alle hören es" : "nur ihr beide"}</small></button>`).join("")}</div>` : "";
  const fehlt = (e.fehlt || []).length ? `<div class="erm-fehlt"><b>Still missing</b>${e.fehlt.slice(0, 3).map(f => `<span>${esc(f)}</span>`).join("")}</div>` : "";
  return fehlt + ws + akt + kf + `<small class="leer">Every action costs a turn. What you find goes into the Codex (C) under “Investigation”.</small>`;
}
function ermKonfront(id, oeffentlich){
  if (oeffentlich && !confirm("Accuse them in front of everyone? Without a complete chain it stands as a public accusation – and you'll have to take it back in public later.")) return;
  ERM.offen = false; senden("konfrontieren", {id}, "…");
}
function codexErmittlungHtml(e){
  if (!e) return "";
  const fragen = e.fragen.map(f => `<li class="${f.belegt ? "belegt" : ""}">${f.belegt ? "●" : "○"} ${esc(f.frage)}</li>`).join("");
  const eintr = e.eintraege.length ? `<ul class="liste erml">${e.eintraege.map(x => `<li><small class="leer">${esc(x.zeit)}</small> ${esc(x.text)} <span class="zuv ${x.beweis ? "bew" : ""}">${esc(x.zuv)}</span> <small class="leer">· found ${esc(x.gefunden)}</small></li>`).join("")}</ul>`
    : `<p class="leer">Nothing secured yet. Start where it happened.</p>`;
  const ws = e.widersprueche.length ? `<div><h3>The timing doesn't add up</h3><ul class="liste">${e.widersprueche.map(w => `<li>${uiIc("time", "klein")} ${esc(w)}</li>`).join("")}</ul></div>` : "";
  const ger = e.geruechte.length ? `<div><h3>Rumours · no proof, just a hint where to look</h3><ul class="liste">${e.geruechte.map(g => `<li>${uiIc("talk", "klein")} ${esc(g)}</li>`).join("")}</ul></div>` : "";
  const aussen = e.aussen && e.aussen.length ? `<div><h3>Possible now · no scene needed</h3><div class="gesten">${e.aussen.map(a => ermAktionHtml(a, true)).join("")}</div></div>` : "";
  return `<div><h3>Investigation</h3><ul class="fragen">${fragen}</ul>${e.kette ? `<p class="kette">The chain holds. You can confront someone with the evidence.</p>` : ""}</div>
    <div><h3>What you know · by time</h3>${eintr}</div>${ws}${ger}${aussen}`;
}
function geste(id){ if (id === "privat_gehen"){ GESTEN.privat = true; return zeichnen(); } GESTEN.offen = false; senden("geste", {id, an: GESTEN.an}, "…"); }
function privatGehen(ort){ GESTEN.offen = false; GESTEN.privat = false; senden("geste", {id: "privat_gehen", an: GESTEN.an, ort}, "…"); }
const RISIKO = ["no risk", "low risk", "some risk", "high risk"];
function privatHtml(g, an){       // Ortswahl bei Go somewhere private (Duc 02.11.2026, kern/orte.py)

    const a = mitTempo(new Audio("/api/zeile?id=" + encodeURIComponent(key)));
    ECHO_CTX = ECHO_CTX || new (window.AudioContext || window.webkitAudioContext)();

const KARTE = {k: null, geht: false, bereit: null, warte: null, fertig: null};
const karteBewegt = () => !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
function karteSetzen(k, html){

function karteZaehlen(el){
  const ziel = +el.dataset.zahl, text = n => (n > 0 ? "+" + n : n < 0 ? "−" + Math.abs(n) : "±0");
  if (!ziel || !karteBewegt()){ el.textContent = text(ziel); return; }
  el.textContent = text(0);
  const start = performance.now() + 750, dauer = 900;
  const schritt = t => {
    const p = Math.max(0, Math.min(1, (t - start) / dauer));
    el.textContent = text(Math.round(ziel * (1 - Math.pow(1 - p, 3))));
    if (p < 1) requestAnimationFrame(schritt); else el.classList.add("fertig");

  return `<button class="kabkreis" type="button" onclick="kabBetreten()" ${beschaeftigt ? "disabled" : ""} title="Your cabin (K) · costs no time" aria-label="Your cabin">
    <span class="bild" style="background-image:url('${k.bild || ""}')"></span>${neu ? `<i class="punkt" title="New keepsake"></i>` : ""}
    <span class="lab">Cabin <kbd>K</kbd></span></button>`;
}
function kabBetreten(){ senden("kabine", {}, "You go to your cabin …"); }

function dock(z){
  const d = $("dock");
  if (!z || !z.persona){ d.hidden = true; return; }
  d.hidden = false;
  const ungelesen = z.handy.filter(f => !f.gelesen).length;
  d.innerHTML = [["handy","phone","Phone (H)", ungelesen], ["laden","map","Map (M)"], ["inventory","backpack","Inventory (I)"], ["character","character","Character (C)"], ["bez","love","Relationships (B)"], ["journal","journal","Journal (N)"], ["codex","codex","Codex (J)"], ["menue","menu","Menu (Esc)"]]
    .map(([k, ic, t, n]) => `<button type="button" aria-pressed="${overlay === k}" title="${t}" aria-label="${t}" onclick="ebeneOeffnen('${k}')">${uiIc(ic)}${n ? `<b>${n}</b>` : window.EdenMenu && EdenMenu.punkt(z, k) ? `<i class="dock-punkt" title="Something new"></i>` : ""}</button>`).join("");
}

function toast(z){
  const T = $("toast");
  const leer = !z || !z.meldungen.length || beschaeftigt || overlay || z.meldungen[z.meldungen.length - 1].still || z.meldungen[z.meldungen.length - 1].tag_ende;
  if (leer){ T.innerHTML = ""; T.dataset.k = ""; return; }
  const m = z.meldungen[z.meldungen.length - 1], k = z.meldung_nr + "|" + m.titel + "|" + (m.kurz || "") + "|" + (m.folgen || []).join();
  const zeigen = !weggeklickt.has(k) && (z.status !== "szene" || (z.szene && z.szene.zug === 0));
  TOAST_K = zeigen ? k : null;
  if (T.dataset.k === (zeigen ? k : "")) return;      // gleiche Meldung: nicht neu zeichnen, sonst laeuft die Animation neu
  T.dataset.k = zeigen ? k : "";
  T.innerHTML = zeigen ? `<div class="glas"><div class="t"><b>${esc(m.titel)}</b>${m.kurz ? `<p>${esc(m.kurz)}</p>` : ""}
    ${m.folgen && m.folgen.length ? `<div class="folgen" style="justify-content:flex-start">${m.folgen.map(f => `<span>${esc(f)}</span>`).join("")}</div>` : ""}</div>
    <button class="zu" type="button" aria-label="Close" onclick="toastZu()">${uiIc("close")}</button></div>` : "";
}

// Porträtreihe statt Reitern (25.10.2026): Orte anklicken - Totò, Rosi, Megan, Lola; der Tender bringt zu Alva
function ladenPortraets(z, r, beiToto){
  const h = z.handel;
  const bild = lid => {
    const t = lid === h.haendler ? h.haendler_buehne : (h.buehnen || {})[lid];
    const zl = t && (t.gruss || t[Object.keys(t).find(k => t[k] && t[k].sprite)]);
    return zl && zl.sprite ? avatar(zl.sprite) : `<span class="av"></span>`;
  };
  const knopf = (lid, name, offen, hinweis) => `<button type="button" class="lport" aria-pressed="${lid === r || (lid === h.haendler && beiToto)}" ${offen ? "" : "disabled"}
      title="${esc(hinweis || "")}" onclick="LADEN.reiter='${lid}';ladenOeffnen();zeichnen()">${bild(lid)}<span>${esc(name)}</span></button>`;
  const alle = Object.entries(h.laeden);
  const reihenfolge = ["toto", "rosi", "megan", "lola"];
  const schiff = reihenfolge.filter(k => h.laeden[k]).concat(alle.filter(([k, l]) => !l.nur_an_land && !reihenfolge.includes(k)).map(([k]) => k));
  const insel = alle.filter(([k, l]) => l.nur_an_land);
  const name = k => k === h.haendler ? h.haendler_name : (h.laeden[k].name);
  const extra = [["inventar", `Inventory ${h.belegt}/6`]].concat(z.kampf_profil ? [["faehigkeiten", `Skills${z.kampf_profil.skillpunkte ? " ●" : ""}`]] : []);

    ${insel.length ? `<div class="lportgruppe tender"><small>${uiIc("tender", "klein")} Tender to Cala d'Orsu</small><div class="lportreihe">${insel.map(([k, l]) =>
      knopf(k, name(k), !!l.waren || l.waren === undefined && false, l.waren ? "" : "The tender only runs on days you've been ashore.")).join("")}</div></div>` : ""}
    <div class="lportgruppe"><small>Du</small><div class="reiterzeile">${extra.map(([k, l]) => `<button type="button" aria-pressed="${k === r}" onclick="LADEN.reiter='${k}';ladenOeffnen();zeichnen()">${l}</button>`).join("")}</div></div></div>`;
}

// ------------------------------------------------------------------ Vorlieben (18.10.2026)
// Lavendel-Meldung oben rechts: eine nach der anderen, ~6 s, Pause bei Maus/Fokus. Sobald eine Meldung erscheint,

const VMQ = [], VM_GESEHEN = new Set();

let PFIG = {id: null, reiter: "vorlieben", item: null};
const vmPost = (aktion, daten) => fetch("/api/" + aktion, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(daten)}).catch(() => {});
// Spieltest Duc 29.10.2026: nie mitten in Szene/Kampf/Expedition, sondern danach; mehrere auf einmal = EINE Meldung.
const vmRuhig = z => ["wahl", "kabine", "ende"].includes(z.status) && !z.expedition;
function vmPruefen(z){
  if (!z || !z.vorlieben) return;

    const k = e.figur + "|" + e.item;
    if (!VM_GESEHEN.has(k)){ VM_GESEHEN.add(k); VMQ.push(e); }

function vmNaechste(){

function profilST(i){ const a = ST_AVATARE[i]; cropLaden(a.url, "st:" + a.name, null, null); }
function profilDatei(f){
  if (!f || !/^image\//.test(f.type)) return fehler("That's not a picture.");
  const r = new FileReader();
  r.onload = () => {
    const img = new Image();
    img.onload = () => {        // Original auf hoechstens 2048 px verkleinern (JPEG) - reicht zum Nachjustieren
      const s = Math.min(1, 2048 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const daten = c.toDataURL("image/jpeg", .92);
      cropLaden(daten, "upload", daten, null);
    };
    img.onerror = () => fehler("The picture can't be read.");
    img.src = r.result;
  };
  r.readAsDataURL(f);
}
function cropLaden(url, quelle, original, crop){
  const img = new Image();
  img.onload = () => {
    Object.assign(CROP, {img, quelle, original, cx: .5, cy: .38, zoom: 1, max: 5, modus: "profil"}, crop || {});
    PROFIL_UI.schritt = "zuschnitt"; zeichnen();
  };
  img.onerror = () => fehler("Picture not found.");
  img.src = url;
}
// Quadrat im Bild (Pixel), das im Kreis liegt
function cropQuelle(){
  // Profilbild: zoom 1 = kurze Bildseite fuellt den Kreis. Figur: Kreisdurchmesser = Spritebreite / zoom.
  const w = CROP.img.naturalWidth, h = CROP.img.naturalHeight, seite = (CROP.modus === "figur" ? w : Math.min(w, h)) / CROP.zoom;
  CROP.cx = Math.min(1 - seite / 2 / w, Math.max(seite / 2 / w, CROP.cx));
  CROP.cy = Math.min(1 - seite / 2 / h, Math.max(seite / 2 / h, CROP.cy));
  return {sx: CROP.cx * w - seite / 2, sy: CROP.cy * h - seite / 2, seite, w, h};
}
function cropMalen(k){
  const q = cropQuelle(), ctx = k.getContext("2d");
  ctx.imageSmoothingQuality = "high"; ctx.clearRect(0, 0, k.width, k.height);
  ctx.drawImage(CROP.img, q.sx, q.sy, q.seite, q.seite, 0, 0, k.width, k.height);
}
function cropZeichnen(){
  const B = $("cropB"), I = $("cropI");
  if (!B || !CROP.img) return;
  const q = cropQuelle(), S = B.clientWidth, sc = S / q.seite;
  if (I.getAttribute("src") !== CROP.img.src) I.src = CROP.img.src;
  I.style.width = q.w * sc + "px"; I.style.height = q.h * sc + "px";
  I.style.left = -q.sx * sc + "px"; I.style.top = -q.sy * sc + "px";
  const z = $("cropZ"); if (z && +z.value !== CROP.zoom) z.value = CROP.zoom;
  ["cropK1", "cropK2"].forEach(id => { const k = $(id); if (k) cropMalen(k); });
  if (CROP.modus === "figur"){           // andere Gefuehle/Outfits mit demselben Ausschnitt
    const stil = ausschnittStil(figurCrop());
    document.querySelectorAll(".cropbsp").forEach(el => { el.style.cssText = `background-image:url('${el.dataset.url}');${stil}`; });
  }
}
const figurCrop = () => ({cx: CROP.cx, cy: CROP.cy, zoom: CROP.zoom, r: CROP.img.naturalHeight / CROP.img.naturalWidth});
function cropAufbauen(){
  const B = $("cropB");
  if (!B || !CROP.img || B.dataset.an) return cropZeichnen();
  B.dataset.an = "1";
  B.addEventListener("pointerdown", ev => { B.setPointerCapture(ev.pointerId); CROP.zug = {x: ev.clientX, y: ev.clientY}; });
  B.addEventListener("pointermove", ev => {
    if (!CROP.zug) return;
    const q = cropQuelle(), proPx = q.seite / B.clientWidth;      // Bildpixel je Bildschirmpixel
    CROP.cx -= (ev.clientX - CROP.zug.x) * proPx / q.w; CROP.cy -= (ev.clientY - CROP.zug.y) * proPx / q.h;
    CROP.zug = {x: ev.clientX, y: ev.clientY}; cropZeichnen();
  });
  const los = () => { CROP.zug = null; };
  B.addEventListener("pointerup", los); B.addEventListener("pointercancel", los);
  B.addEventListener("wheel", ev => { ev.preventDefault(); CROP.zoom = Math.min(CROP.max, Math.max(1, CROP.zoom * Math.exp(-ev.deltaY * .0015))); cropZeichnen(); }, {passive: false});
  cropZeichnen();
}
async function cropSpeichern(){
  const k = document.createElement("canvas"); k.width = k.height = 512; cropMalen(k);
  const daten = {ziel: PROFIL_UI.ziel, bild: k.toDataURL("image/png"), quelle: CROP.quelle,
                 crop: {cx: +CROP.cx.toFixed(4), cy: +CROP.cy.toFixed(4), zoom: +CROP.zoom.toFixed(3)}};
  if (CROP.original) daten.original = CROP.original;
  await profilSenden(daten);

}
// 16.10.2026: Durchlauf-ID gehoert in den Schluessel - sonst gilt die gleiche Szene in einem neuen Durchlauf als schon gespielt
const szenenSchluessel = z => z.id + "|" + z.tag + "|" + z.phase + "|" + z.szene.titel;
// Kurzer Text-Fingerabdruck fuer die Audio-URL: gleiche Position, anderer Text = andere URL (kein Browser-Cache-Treffer)
const fingerabdruck = s => { let h = 0; for (const c of String(s || "")) h = (h * 31 + c.codePointAt(0)) | 0; return (h >>> 0).toString(36); };
function stimmeAbspielen(){
  const z = V && V.z;
  if (!STIMME || !z || !z.szene) return;
  const k = szenenSchluessel(z), log = z.szene.log;
  if (!(k in gespielt)) gespielt[k] = 0;
  for (let i = gespielt[k]; i < log.length; i++){
    const e = log[i];
    if ((e.art === "figur" && z.stimmen[e.wer]) || (e.art === "start" && e.vorlesen)){
      audioKette = audioKette.then(() => new Promise(async fertig => {
        try{
          const r = await fetch("/api/audio?i=" + i + "&v=" + fingerabdruck(z.id + "|" + (e.text || "")), {cache: "no-store"});
          if (r.status !== 200) return fertig();
          const a = mitTempo(new Audio(URL.createObjectURL(await r.blob())));
          a.onended = fertig; a.onerror = fertig; await a.play();
        } catch(err){ fertig(); }
      }));
    }
  }
  gespielt[k] = log.length;
}

window.addEventListener("eden-sfx-ready", () => { if (V) EdenSfx.observe(V); EdenSfx.mountSettings(document.getElementById("sfxEinstellungen")); });
window.addEventListener("eden-music-ready",() => { if (V) EdenMusic.update(V.z ? V.musik : V.musik_titel); EdenMusic.mountSettings(document.getElementById("musikEinstellungen")); });
fetch("/api/gesichter").then(r => r.json()).then(g => { GESICHTER = g; }).catch(() => {}).finally(laden);
</script>

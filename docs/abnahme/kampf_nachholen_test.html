<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kampf-Sprites: Testbilder</title>
<style>
:root{--bg:#16130f;--card:#211d17;--line:#3a3328;--text:#efe6d6;--mut:#a89c88;--beige:#d9c39a;--ok:#5fae6e;--neu:#d0644f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:5;background:#16130fee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
 padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
h1{font-size:18px;margin:0;color:var(--beige);font-weight:600}
.zahl{color:var(--mut)}.zahl b{color:var(--text)}
.sp{flex:1}
button{font:inherit;border:1px solid var(--line);background:#2b251d;color:var(--text);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--beige)}
.hinweis{color:var(--mut);padding:10px 16px 0;max-width:1100px}
.filter button.an{background:var(--beige);color:#16130f;border-color:var(--beige)}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:16px;padding:16px}
.k{background:var(--card);border:2px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.k.ok{border-color:var(--ok)}.k.neu{border-color:var(--neu)}
.bilder{display:flex;gap:2px;background:#000}
.bilder figure{margin:0;flex:1;position:relative;min-width:0}
.bilder figure.v{flex:0 0 32%}
.bilder img{width:100%;height:300px;object-fit:contain;display:block;cursor:zoom-in;background:#0c0a08}
.bilder figcaption{position:absolute;left:6px;top:6px;font-size:12px;background:#000a;padding:1px 6px;border-radius:4px;color:var(--mut)}
.inh{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.kopf{display:flex;gap:8px;align-items:baseline}.kopf b{font-size:16px}.kopf span{color:var(--mut);font-size:12px;margin-left:auto}
.soll{color:var(--mut);font-size:13px}
.knoepfe{display:flex;gap:8px}
.knoepfe button{flex:1;padding:8px}
.k.ok .b-ok{background:var(--ok);border-color:var(--ok);color:#0d1a10}
.k.neu .b-neu{background:var(--neu);border-color:var(--neu);color:#1a0d0a}
textarea{font:inherit;font-size:13px;width:100%;min-height:38px;resize:vertical;background:#16130f;color:var(--text);
 border:1px solid var(--line);border-radius:8px;padding:6px 8px}
#gross{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}
#gross img{max-width:96vw;max-height:94vh}
#kopiert{color:var(--ok);display:none}
</style></head><body>
<header><h1>Kampf-Sprites: Testbilder</h1>
 <span class="zahl"><b id="n-ok">0</b> OK · <b id="n-neu">0</b> neu · <b id="n-offen">0</b> offen</span>
 <span class="filter"><button data-f="alle" class="an">Alle</button> <button data-f="offen">Offen</button> <button data-f="neu">Neu</button></span>
 <span class="sp"></span>
 <button id="alle-ok">Rest OK</button>
 <button id="kopieren">Ergebnis kopieren</button><span id="kopiert">kopiert</span>
</header>
<div class="hinweis">Je Figur ein Testbild. ✓ OK oder ✗ Neu, bei Neu kurz notieren, was anders werden soll. Bei den Alphas steht rechts der normale Gegner zum Vergleich. Wenn alles markiert ist: Claude Bescheid sagen.</div>
<main id="liste"></main>
<div id="gross"><img alt=""></div>
<script>
const D = {"id": "kampf_nachholen_test_2026-10-22", "titel": "Kampf-Sprites: Testbilder", "items": [{"id": "YasinDrone", "titel": "Yasin (wütend, Drohne)", "soll": "Wütender Blick, zusammengebissener Kiefer; offenes Leinenhemd, Goldkette, Drohnen-Fernbedienung, schwarze Quadrocopter-Drohne auf Kopfhöhe", "bild": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/YasinDrone/outfit_check.png", "stand": "22.10. 12:19", "vergleich": "", "vergleich_titel": "Vergleich"}, {"id": "MaxwellSteward", "titel": "Maxwell (Steward-Polo)", "soll": "Weißes Polo MIT umgelegtem Kragen und Knopfleiste, goldener Anker links, Namensschild MR. MAXIMUM, navy Shorts", "bild": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/MaxwellSteward/outfit_check.png", "stand": "22.10. 12:19", "vergleich": "", "vergleich_titel": "Vergleich"}, {"id": "Alon", "titel": "Alon (Cyber-Rüstung)", "soll": "Glänzend klavierschwarze Cyber-Rüstung wie die Item-Rüstung v8, Chrom-Jetpack, Fliegerbrille, weiß-schwarze Strahlenpistole rechts", "bild": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/Alon/outfit_check.png", "stand": "22.10. 12:20", "vergleich": "", "vergleich_titel": "Vergleich"}, {"id": "WildschweinKlein", "titel": "Wildschwein klein", "soll": "Junges, schlankes korsisches Wildschwein, rotbraun, noch keine Hauer", "bild": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/WildschweinKlein/outfit_check.png", "stand": "22.10. 12:20", "vergleich": "", "vergleich_titel": "Vergleich"}, {"id": "Wildschwein", "titel": "Wildschwein", "soll": "Kräftiges Wildschwein, dunkelbraune Borsten, Rückenkamm, kurze weiße Hauer", "bild": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/Wildschwein/outfit_check.png", "stand": "22.10. 12:20", "vergleich": "", "vergleich_titel": "Vergleich"}, {"id": "WildschweinKeiler", "titel": "Keiler", "soll": "Riesiger alter Keiler, grau-schwarz mit Silberkamm, lange gelbliche Hauer, Narbe über Schnauze und Auge, eingerissenes Ohr", "bild": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/WildschweinKeiler/outfit_check.png", "stand": "22.10. 12:20", "vergleich": "", "vergleich_titel": "Vergleich"}, {"id": "RatAlpha", "titel": "Ratte (Alpha)", "soll": "an unusually huge old harbour rat, scarred grey-brown fur, a torn ear, a long scarred pink tail, small fierce black eyes, long yellow front teeth, pink paws", "bild": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/RatAlpha/outfit_check.png", "stand": "22.10. 12:20", "vergleich": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/Rat/idle.png", "vergleich_titel": "normal"}, {"id": "DogAlpha", "titel": "Hund (Alpha)", "soll": "a huge muscular fighting dog, short dark brindle fur marked with old scars, a thick plain black leather collar, a broad heavy head, one torn ear, drooling jaws", "bild": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/DogAlpha/outfit_check.png", "stand": "22.10. 12:20", "vergleich": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/Dog/idle.png", "vergleich_titel": "normal"}, {"id": "SeagullAlpha", "titel": "Möwe (Alpha)", "soll": "an enormous fat seagull wearing a battered tiny captain's cap tilted on its head, ruffled white and grey feathers, a yellow beak with a red spot, fierce beady eyes", "bild": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/SeagullAlpha/outfit_check.png", "stand": "22.10. 12:21", "vergleich": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/Seagull/idle.png", "vergleich_titel": "normal"}, {"id": "PigeonAlpha", "titel": "Taube (Alpha)", "soll": "a very fat grand old city pigeon, puffed-up grey feathers with an iridescent green and purple neck, a shiny gold ring on one leg, a self-important stare", "bild": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/PigeonAlpha/outfit_check.png", "stand": "22.10. 12:21", "vergleich": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/Pigeon/idle.png", "vergleich_titel": "normal"}, {"id": "BatAlpha", "titel": "Fledermaus (Alpha)", "soll": "a large vampire bat with wings spread, dark grey-black leathery wings, deep red eyes, large pointed ears, sharp white fangs", "bild": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/BatAlpha/outfit_check.png", "stand": "22.10. 12:21", "vergleich": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/Bat/idle.png", "vergleich_titel": "normal"}, {"id": "SnakeAlpha", "titel": "Schlange (Alpha)", "soll": "an enormous ancient king cobra, hood spread wide, smooth dark olive and black scales, old pale scars along its body, a forked tongue", "bild": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/SnakeAlpha/outfit_check.png", "stand": "22.10. 12:21", "vergleich": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/Snake/idle.png", "vergleich_titel": "normal"}, {"id": "ApeAlpha", "titel": "Affe (Alpha)", "soll": "a huge silverback ape, dark fur with a broad silver-grey back, massive long arms, a scarred leathery face, a torn zoo ear tag", "bild": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/ApeAlpha/outfit_check.png", "stand": "22.10. 12:21", "vergleich": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/Ape/idle.png", "vergleich_titel": "normal"}, {"id": "LionAlpha", "titel": "Löwe (Alpha)", "soll": "a huge old male lion with a thick black mane, many old scars on its muzzle, a torn ear, powerful paws", "bild": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/LionAlpha/outfit_check.png", "stand": "22.10. 12:22", "vergleich": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/Lion/idle.png", "vergleich_titel": "normal"}, {"id": "SharkAlpha", "titel": "Hai (Alpha)", "soll": "an enormous great white shark covered in long old scars, a torn dorsal fin, grey back and white belly, half out of the water", "bild": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/SharkAlpha/outfit_check.png", "stand": "22.10. 12:22", "vergleich": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/Shark/idle.png", "vergleich_titel": "normal"}, {"id": "PirateAlpha", "titel": "Pirat (Alpha)", "soll": "a long dark red pirate captain's coat with tarnished gold buttons, a black tricorn hat, a white shirt, a wide leather belt, high black boots, a long curved cutlass", "bild": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/PirateAlpha/outfit_check.png", "stand": "22.10. 12:22", "vergleich": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/Pirate/idle.png", "vergleich_titel": "normal"}, {"id": "ThiefAlpha", "titel": "Dieb (Alpha)", "soll": "a worn black leather jacket over a dark hoodie with the hood down, black jeans, heavy black boots, a thick silver chain necklace, a short steel crowbar", "bild": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/ThiefAlpha/outfit_check.png", "stand": "22.10. 12:22", "vergleich": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/Thief/idle.png", "vergleich_titel": "normal"}, {"id": "BruteAlpha", "titel": "Schläger (Alpha)", "soll": "a ripped black tank top, grey work trousers, heavy steel-toe boots, a heavy iron chain wrapped around one fist, taped knuckles", "bild": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/BruteAlpha/outfit_check.png", "stand": "22.10. 12:22", "vergleich": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/Brute/idle.png", "vergleich_titel": "normal"}, {"id": "AgentAlpha", "titel": "Agent (Alpha)", "soll": "a sharp white tailored suit, a black shirt, a white tie, an earpiece with a coiled wire, black sunglasses pushed up into his hair, black gloves", "bild": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/AgentAlpha/outfit_check.png", "stand": "22.10. 12:22", "vergleich": "file:///X:/AI/ComfyUI_krea2/ComfyUI/output/expressions/combat/Agent/idle.png", "vergleich_titel": "normal"}]};
const KEY = "abnahme:" + D.id;
let S = {};
try { S = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { S = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} zaehlen(); };
let filter = "alle";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function karte(it) {
  const st = S[it.id] || {};
  const el = document.createElement("section");
  el.className = "k " + (st.urteil || "");
  el.dataset.id = it.id;
  el.innerHTML =
    '<div class="bilder"><figure><img loading="lazy" src="' + it.bild + '" alt=""><figcaption>neu</figcaption></figure>' +
    (it.vergleich ? '<figure class="v"><img loading="lazy" src="' + it.vergleich + '" alt=""><figcaption>' + esc(it.vergleich_titel) + '</figcaption></figure>' : '') +
    '</div><div class="inh"><div class="kopf"><b>' + esc(it.titel) + '</b><span>' + esc(it.stand) + '</span></div>' +
    (it.soll ? '<div class="soll">' + esc(it.soll) + '</div>' : '') +
    '<div class="knoepfe"><button class="b-ok">✓ OK</button><button class="b-neu">✗ Neu</button></div>' +
    '<textarea placeholder="Notiz (was soll anders werden?)">' + esc(st.notiz || "") + '</textarea></div>';
  el.querySelector(".b-ok").onclick = () => setze(it.id, "ok");
  el.querySelector(".b-neu").onclick = () => setze(it.id, "neu");
  el.querySelector("textarea").oninput = e => { (S[it.id] = S[it.id] || {}).notiz = e.target.value; save(); };
  el.querySelectorAll("img").forEach(i => i.onclick = () => { gross.querySelector("img").src = i.src; gross.style.display = "flex"; });
  return el;
}
function setze(id, urteil) {
  const st = S[id] = S[id] || {};
  st.urteil = st.urteil === urteil ? "" : urteil;
  document.querySelector('[data-id="' + id + '"]').className = "k " + st.urteil;
  save(); zeigen();
}
function zaehlen() {
  const u = D.items.map(it => (S[it.id] || {}).urteil || "");
  document.getElementById("n-ok").textContent = u.filter(x => x === "ok").length;
  document.getElementById("n-neu").textContent = u.filter(x => x === "neu").length;
  document.getElementById("n-offen").textContent = u.filter(x => !x).length;
}
function zeigen() {
  document.querySelectorAll(".k").forEach(el => {
    const u = (S[el.dataset.id] || {}).urteil || "";
    el.style.display = filter === "alle" || (filter === "offen" ? !u : u === filter) ? "" : "none";
  });
}
function ergebnis() {
  const z = ["Abnahme " + D.titel + ":"];
  for (const it of D.items) {
    const st = S[it.id] || {};
    z.push("- " + it.id + ": " + (st.urteil === "ok" ? "OK" : st.urteil === "neu" ? "NEU" : "offen") + (st.notiz ? " – " + st.notiz.trim() : ""));
  }
  return z.join("\n");
}
window.abnahme = () => ({id: D.id, urteile: S, text: ergebnis()});   // read by Claude from the browser pane
const liste = document.getElementById("liste"), gross = document.getElementById("gross");
D.items.forEach(it => liste.appendChild(karte(it)));
gross.onclick = () => gross.style.display = "none";
document.querySelectorAll(".filter button").forEach(b => b.onclick = () => {
  filter = b.dataset.f; document.querySelectorAll(".filter button").forEach(x => x.classList.toggle("an", x === b)); zeigen();
});
document.getElementById("alle-ok").onclick = () => {
  D.items.forEach(it => { const st = S[it.id] = S[it.id] || {}; if (!st.urteil) st.urteil = "ok"; });
  document.querySelectorAll(".k").forEach(el => el.className = "k " + (S[el.dataset.id].urteil || ""));
  save(); zeigen();
};
document.getElementById("kopieren").onclick = async () => {
  try { await navigator.clipboard.writeText(ergebnis()); } catch (e) { prompt("Ergebnis:", ergebnis()); return; }
  const k = document.getElementById("kopiert"); k.style.display = "inline"; setTimeout(() => k.style.display = "none", 1500);
};
zaehlen();
</script></body></html>

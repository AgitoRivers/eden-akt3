<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nachzug fehlender Bilder – Abnahme</title>
<style>
:root{--bg:#16130f;--card:#211d17;--line:#3a3328;--text:#efe6d6;--mut:#a89c88;--beige:#d9c39a;--ok:#5fae6e;--neu:#d0644f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:5;background:#16130fee;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
 padding:12px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
h1{font-size:18px;margin:0;color:var(--beige);font-weight:600}
.zahl{color:var(--mut)}.zahl b{color:var(--text)}
.sp{flex:1}
button{font:inherit;border:1px solid var(--line);background:#2b251d;color:var(--text);border-radius:8px;padding:6px 12px;cursor:pointer}
button:hover{border-color:var(--beige)}
.hinweis{color:var(--mut);padding:10px 16px 0;max-width:1100px}
.filter button.an{background:var(--beige);color:#16130f;border-color:var(--beige)}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:16px;padding:16px}
.k{background:var(--card);border:2px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.k.ok{border-color:var(--ok)}.k.neu{border-color:var(--neu)}
.bilder{display:flex;gap:2px;background:#000}
.bilder figure{margin:0;flex:1;position:relative;min-width:0}
.bilder figure.v{flex:0 0 45%}
.bilder img{width:100%;height:300px;object-fit:contain;display:block;cursor:zoom-in;background:#8f897e}   /* Grau: freigestellte Sprites (auch dunkle) bleiben sichtbar */
.bilder .leer{height:300px;display:flex;align-items:center;justify-content:center;background:#0c0a08;color:var(--mut);
 font-size:14px;letter-spacing:.04em;border:1px dashed var(--line)}
.bilder figcaption{position:absolute;left:6px;top:6px;font-size:12px;background:#000a;padding:1px 6px;border-radius:4px;color:var(--mut)}
.inh{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.kopf{display:flex;gap:8px;align-items:baseline}.kopf b{font-size:16px}.kopf span{color:var(--mut);font-size:12px;margin-left:auto}
.soll{color:var(--mut);font-size:13px}
.knoepfe{display:flex;gap:8px}
.knoepfe button{flex:1;padding:8px}
.k.ok .b-ok{background:var(--ok);border-color:var(--ok);color:#0d1a10}
.k.neu .b-neu{background:var(--neu);border-color:var(--neu);color:#1a0d0a}
textarea{font:inherit;font-size:13px;width:100%;min-height:38px;resize:vertical;background:#16130f;color:var(--text);
 border:1px solid var(--line);border-radius:8px;padding:6px 8px}
#gross{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}
#gross img{max-width:96vw;max-height:94vh}
#kopiert{color:var(--ok);display:none}
</style></head><body>
<header><h1>Nachzug fehlender Bilder – Abnahme</h1>
 <span class="zahl"><b id="n-ok">0</b> OK · <b id="n-neu">0</b> neu · <b id="n-offen">0</b> offen</span>
 <span class="filter"><button data-f="alle" class="an">Alle</button> <button data-f="offen">Offen</button> <button data-f="neu">Neu</button></span>
 <span class="sp"></span>
 <button id="alle-ok">Rest OK</button>
 <button id="kopieren">Ergebnis kopieren</button><span id="kopiert">kopiert</span>
</header>
<div class="hinweis">19 neue Item-Bilder und 14 Hintergründe für Figuren ohne Raum an Bord (vorhandene Bilder, nur zugeordnet). OK / Neu + Notiz.</div>
<main id="liste"></main>
<div id="gross"><img alt=""></div>
<script>

 06:53", "vergleich": "", "vergleich_titel": "Vergleich"}, {"id": "treasure_notes", "titel": "Item · Chloé's Notes", "soll": "a clear waterproof document folder holding old photographs of a wooden schooner and a nautical map of a bay with one red circle drawn on it", "bild": "file:///X:/AI/Eden/docs/abnahme/item_nachzug/treasure_notes.png", "stand": "29.10. 06:53", "vergleich": "", "vergleich_titel": "Vergleich"}, {"id": "lea_chart_page", "titel": "Item · Page Forty", "soll": "a single page torn from an old nautical chart book, soft pencil lines of a bay, one small pencil cross and a faded date in the margin", "bild": "file:///X:/AI/Eden/docs/abnahme/item_nachzug/lea_chart_page.png", "stand": "29.10. 06:54", "vergleich": "", "vergleich_titel": "Vergleich"}, {"id": "bg_megan", "titel": "Hintergrund · Megan McAllister", "soll": "Profil und Missionen: eden_hq_megan_office.png (vorhandenes Bild)", "bild": "file:///X:/AI/SillyTavern3/SillyTavern-Launcher/SillyTavern/data/default-user/backgrounds/eden_hq_megan_office.png", "stand": "17.10. 18:54", "vergleich": "", "vergleich_titel": "Vergleich"}, {"id": "bg_nonna", "titel": "Hintergrund · Nonna Fiora", "soll": "Profil und Missionen: eden_rise_monastery_kitchen.png (vorhandenes Bild)", "bild": "file:///X:/AI/SillyTavern3/SillyTavern-Launcher/SillyTavern/data/default-user/backgrounds/eden_rise_monastery_kitchen.png", "stand": "21.10. 22:40", "vergleich": "", "vergleich_titel": "Vergleich"}, {"id": "bg_isabelle", "titel": "Hintergrund · Isabelle", "soll": "Profil und Missionen: eden_rise_monastery_garden_dusk.png (vorhandenes Bild)", "bild": "file:///X:/AI/SillyTavern3/SillyTavern-Launcher/SillyTavern/data/default-user/backgrounds/eden_rise_monastery_garden_dusk.png", "stand": "21.10. 22:35", "vergleich": "", "vergleich_titel": "Vergleich"}, {"id": "bg_frederico", "titel": "Hintergrund · Frederico", "soll": "Profil und Missionen: eden_rise_monastery_gate.png (vorhandenes Bild)", "bild": "file:///X:/AI/SillyTavern3/SillyTavern-Launcher/SillyTavern/data/default-user/backgrounds/eden_rise_monastery_gate.png", "stand": "21.10. 22:41", "vergleich": "", "vergleich_titel": "Vergleich"}, {"id": "bg_laetitia", "titel": "Hintergrund · Laetitia Albertini", "soll": "Profil und Missionen: eden_rise_mountain_lake.png (vorhandenes Bild)", "bild": "file:///X:/AI/SillyTavern3/SillyTavern-Launcher/SillyTavern/data/default-user/backgrounds/eden_rise_mountain_lake.png", "stand": "21.10. 22:33", "vergleich": "", "vergleich_titel": "Vergleich"}, {"id": "bg_adrien", "titel": "Hintergrund · Adrien Morel", "soll": "Profil und Missionen: eden_rise_abandoned_mountain_hut.png (vorhandenes Bild)", "bild": "file:///X:/AI/SillyTavern3/SillyTavern-Launcher/SillyTavern/data/default-user/backgrounds/eden_rise_abandoned_mountain_hut.png", "stand": "27.10. 20:11", "vergleich": "", "vergleich_titel": "Vergleich"}, {"id": "bg_wolff", "titel": "Hintergrund · Kaspar Wolff", "soll": "Profil und Missionen: eden_rise_genoese_tower_camp.png (vorhandenes Bild)", "bild": "file:///X:/AI/SillyTavern3/SillyTavern-Launcher/SillyTavern/data/default-user/backgrounds/eden_rise_genoese_tower_camp.png", "stand": "21.10. 22:34", "vergleich": "", "vergleich_titel": "Vergleich"}, {"id": "bg_ghjuvan", "titel": "Hintergrund · Ghjuvan Santucci", "soll": "Profil und Missionen: eden_rise_bergerie_interior.png (vorhandenes Bild)", "bild": "file:///X:/AI/SillyTavern3/SillyTavern-Launcher/SillyTavern/data/default-user/backgrounds/eden_rise_bergerie_interior.png", "stand": "21.10. 22:32", "vergleich": "", "vergleich_titel": "Vergleich"}, {"id": "bg_dumenica", "titel": "Hintergrund · Dumenica", "soll": "Profil und Missionen: eden_rise_mazzera_hut.png (vorhandenes Bild)", "bild": "file:///X:/AI/SillyTavern3/SillyTavern-Launcher/SillyTavern/data/default-user/backgrounds/eden_rise_mazzera_hut.png", "stand": "27.10. 20:10", "vergleich": "", "vergleich_titel": "Vergleich"}, {"id": "bg_gennaro", "titel": "Hintergrund · Gennaro Esposito", "soll": "Profil und Missionen: eden_rise_gennaro_cell.png (vorhandenes Bild)", "bild": "file:///X:/AI/SillyTavern3/SillyTavern-Launcher/SillyTavern/data/default-user/backgrounds/eden_rise_gennaro_cell.png", "stand": "27.10. 23:56", "vergleich": "", "vergleich_titel": "Vergleich"}, {"id": "bg_matteu", "titel": "Hintergrund · Matteu Pinelli", "soll": "Profil und Missionen: eden_rise_grotto_steps.png (vorhandenes Bild)", "bild": "file:///X:/AI/SillyTavern3/SillyTavern-Launcher/SillyTavern/data/default-user/backgrounds/eden_rise_grotto_steps.png", "stand": "27.10. 23:50", "vergleich": "", "vergleich_titel": "Vergleich"}, {"id": "bg_chloe", "titel": "Hintergrund · Chloé Marchal", "soll": "Profil und Missionen: eden_rise_treasure_camp.png (vorhandenes Bild)", "bild": "file:///X:/AI/SillyTavern3/SillyTavern-Launcher/SillyTavern/data/default-user/backgrounds/eden_rise_treasure_camp.png", "stand": "27.10. 23:59", "vergleich": "", "vergleich_titel": "Vergleich"}, {"id": "bg_riscossore", "titel": "Hintergrund · U Riscossore", "soll": "Profil und Missionen: eden_rise_smugglers_tunnel.png (vorhandenes Bild)", "bild": "file:///X:/AI/SillyTavern3/SillyTavern-Launcher/SillyTavern/data/default-user/backgrounds/eden_rise_smugglers_tunnel.png", "stand": "27.10. 23:54", "vergleich": "", "vergleich_titel": "Vergleich"}, {"id": "bg_sirene", "titel": "Hintergrund · The Siren", "soll": "Profil und Missionen: eden_rise_underground_pool_tide.png (vorhandenes Bild)", "bild": "file:///X:/AI/SillyTavern3/SillyTavern-Launcher/SillyTavern/data/default-user/backgrounds/eden_rise_underground_pool_tide.png", "stand": "28.10. 08:12", "vergleich": "", "vergleich_titel": "Vergleich"}], "server": false, "urteile": {}};
const KEY = "abnahme:" + D.id;
let S = D.urteile || {};
if (!D.server) { try { S = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { S = {}; } }
let timer = null;
const save = () => {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  if (D.server) { clearTimeout(timer); timer = setTimeout(() => fetch("urteil", {method: "POST", body: JSON.stringify(S)}), 300); }
  zaehlen();
};
let filter = "alle";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function karte(it) {
  const st = S[it.id] || {};
  const el = document.createElement("section");
  el.className = "k " + (st.urteil || "");
  el.dataset.id = it.id;
  el.innerHTML =
    '<div class="bilder"><figure>' + (it.bild ? '<img loading="lazy" src="' + it.bild + '" alt="">'
      : '<div class="leer">noch kein Bild</div>') + '<figcaption>neu</figcaption></figure>' +
    (it.vergleich ? '<figure class="v"><img loading="lazy" src="' + it.vergleich + '" alt=""><figcaption>' + esc(it.vergleich_titel) + '</figcaption></figure>' : '') +
    '</div><div class="inh"><div class="kopf"><b>' + esc(it.titel) + '</b><span>' + esc(it.stand) + '</span></div>' +
    (it.soll ? '<div class="soll">' + esc(it.soll) + '</div>' : '') +
    '<div class="knoepfe"><button class="b-ok">✓ OK</button><button class="b-neu">✗ Neu</button></div>' +
    '<textarea placeholder="Notiz (was soll anders werden?)">' + esc(st.notiz || "") + '</textarea></div>';
  el.querySelector(".b-ok").onclick = () => setze(it.id, "ok");
  el.querySelector(".b-neu").onclick = () => setze(it.id, "neu");
  el.querySelector("textarea").oninput = e => { (S[it.id] = S[it.id] || {}).notiz = e.target.value; save(); };
  el.querySelectorAll("img").forEach(i => i.onclick = () => { gross.querySelector("img").src = i.src; gross.style.display = "flex"; });
  return el;
}
function setze(id, urteil) {
  const st = S[id] = S[id] || {};
  st.urteil = st.urteil === urteil ? "" : urteil;
  document.querySelector('[data-id="' + id + '"]').className = "k " + st.urteil;
  save(); zeigen();
}
function zaehlen() {
  const u = D.items.map(it => (S[it.id] || {}).urteil || "");
  document.getElementById("n-ok").textContent = u.filter(x => x === "ok").length;
  document.getElementById("n-neu").textContent = u.filter(x => x === "neu").length;
  document.getElementById("n-offen").textContent = u.filter(x => !x).length;
}
function zeigen() {
  document.querySelectorAll(".k").forEach(el => {
    const u = (S[el.dataset.id] || {}).urteil || "";
    el.style.display = filter === "alle" || (filter === "offen" ? !u : u === filter) ? "" : "none";
  });
}
function ergebnis() {
  const z = ["Abnahme " + D.titel + ":"];
  for (const it of D.items) {
    const st = S[it.id] || {};
    z.push("- " + it.id + ": " + (st.urteil === "ok" ? "OK" : st.urteil === "neu" ? "NEU" : "offen") + (st.notiz ? " – " + st.notiz.trim() : ""));
  }
  return z.join("\n");
}
window.abnahme = () => ({id: D.id, urteile: S, text: ergebnis()});   // read by Claude from the browser pane
const liste = document.getElementById("liste"), gross = document.getElementById("gross");
D.items.forEach(it => liste.appendChild(karte(it)));
gross.onclick = () => gross.style.display = "none";
document.querySelectorAll(".filter button").forEach(b => b.onclick = () => {
  filter = b.dataset.f; document.querySelectorAll(".filter button").forEach(x => x.classList.toggle("an", x === b)); zeigen();
});
document.getElementById("alle-ok").onclick = () => {
  D.items.forEach(it => { const st = S[it.id] = S[it.id] || {}; if (!st.urteil) st.urteil = "ok"; });
  document.querySelectorAll(".k").forEach(el => el.className = "k " + (S[el.dataset.id].urteil || ""));
  save(); zeigen();
};
document.getElementById("kopieren").onclick = async () => {
  try { await navigator.clipboard.writeText(ergebnis()); } catch (e) { prompt("Ergebnis:", ergebnis()); return; }
  const k = document.getElementById("kopiert"); k.style.display = "inline"; setTimeout(() => k.style.display = "none", 1500);
};
zaehlen();
</script></body></html>

<style>/* Gemeinsame Bausteine der Oberflaeche (Duc 30.10.2026). Regeln: docs/wiki/systeme/ui_stil.md */
:root{
  color-scheme: dark;
  --ink:#07080b; --rauch:rgba(9,11,15,.52); --rauch-stark:rgba(9,11,15,.82);
  --perle:#f3eee4; --perle-leise:rgba(243,238,228,.7); --perle-dim:rgba(243,238,228,.45);
  --rede:#ecd8ae; /* direkte Rede: klares Beige, hebt sich vom gedaempften Erzaehltext ab (17.10.2026) */
  --akz:#d8bd86; --akz2:#9db9d6; --gut:#a8d5b1; --schlecht:#d9a198;
  --linie:rgba(216,189,134,.26); --linie-n:rgba(243,238,228,.16);
  --f-name:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-ui:"Geist","Segoe UI",system-ui,sans-serif;
  --f-zahl:"Geist Mono",ui-monospace,"Cascadia Mono",monospace;
  --chat-b:clamp(360px,33vw,540px); --rand:20px;
  --t-mini:11px; --t-klein:12.5px; --t-info:14px; --t-text:15px; --t-gross:18px; --t-unter:20px; --t-titel:24px; --t-kopf:32px; --t-held:40px; --t-buehne:56px; --t-riesig:72px;
  --r-fein:4px; --r-taste:8px; --r-mittel:14px; --r-karte:22px; --r-panel:26px; --r-rund:999px; --r-geraet:46px; --r-geraet-innen:38px; --r-kopfform:120px;
  --a1:4px; --a15:6px; --a2:8px; --a25:10px; --a3:12px; --a35:14px; --a4:16px; --a45:20px; --a5:24px; --a6:32px; --a7:48px;
  --pille-klein:2px 8px; --pille:4px 12px; --pille-gross:8px 16px; --pille-knopf:12px 24px;
  --karte-pad-klein:10px 12px; --karte-pad:12px 16px; --karte-pad-gross:18px 20px;
  --flaeche:#14161b; --flaeche2:#1f2229; --dunkelbraun:#1b1610; --grau-hell:#c9c4bb; --grau:#8d8a85; --grau-dunkel:#5a5d66; --gold-hell:#e8c069; --gold-dunkel:#a88a4f; --creme:#f6ecd2; --rot:#c3271c; --rot-dunkel:#8a1d14; --warn:#f0b35a; --ausweichen:#8ec5ff; --wasser:#6fb6e6; --pfad-k:#e0895f; --pfad-s:#b79ae6; --pfad-j:#6fc7b9; --pfad-h:#9fd6a6; --pfad-m:#ef6a3c; --papier:#f4ecd6; --tinte:#23252e;
}
.ui-ic{width:24px;height:24px;flex:none;display:block;fill:currentColor}
.ui-ic.klein{width:16px;height:16px;display:inline-block;vertical-align:-3px}
.ui-ic.imtext{width:1em;height:1em;display:inline-block;vertical-align:-.12em}
.ui-ic.leer{opacity:.3}
.ui-ic.imtext + .ui-ic.imtext{margin-left:-.12em}
/* Grundbausteine */
.glas{background:var(--rauch);border:1px solid var(--linie);backdrop-filter:blur(20px) saturate(1.15);-webkit-backdrop-filter:blur(20px) saturate(1.15);box-shadow:0 18px 50px rgba(0,0,0,.35)}
.name{font-family:var(--f-name);font-weight:750;letter-spacing:-.02em}
.zahl{font-family:var(--f-zahl);font-variant-numeric:tabular-nums}
.knopf,.kampf .knopf{border:0;border-radius:var(--r-rund);padding:11px 20px;background:var(--akz);color:var(--ink);font-weight:600}
.knopf.leise,.kampf .knopf.leise{background:rgba(243,238,228,.08);color:var(--perle);border:1px solid var(--linie-n)}
.knopf:disabled,.kampf .knopf:disabled{opacity:.45;cursor:default}
@property --ui-p{syntax:"<number>";inherits:false;initial-value:0}

/* Status-Knopf: Icon im Ring, der Ring zeigt den Fuellstand. Niedrig = Farbe und "!" (lesbar auch ohne Farbsehen). */
.ui-statusleiste{display:flex;align-items:flex-start;gap:var(--a2)}
.ui-statusleiste.mit-namen{gap:var(--a3)}
.ui-status{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:0;border:0;background:none;color:var(--perle);cursor:pointer}
.ui-ring{--ui-p:0;position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--perle);
  background:conic-gradient(var(--ui-farbe,var(--akz)) calc(var(--ui-p)*1%),rgba(243,238,228,.16) 0);transition:--ui-p .5s ease}
.ui-ring::before{content:"";position:absolute;inset:3px;border-radius:50%;background:#14161b;transition:background .15s}
.ui-ring .ui-ic{position:relative;width:22px;height:22px}
.ui-status:hover .ui-ring::before{background:#20232a}
.ui-status[aria-expanded="true"] .ui-ring{box-shadow:0 0 0 2px #14161b,0 0 0 4px var(--perle)}
.ui-status.niedrig .ui-ring{--ui-farbe:var(--schlecht);color:var(--schlecht)}
.ui-status.niedrig .ui-ring::after{content:"!";position:absolute;right:-2px;top:-2px;width:15px;height:15px;border-radius:50%;background:var(--schlecht);color:var(--ink);font:700 var(--t-mini)/15px var(--f-ui);text-align:center}
.ui-name{display:none;font-size:var(--t-klein);line-height:1.2;color:var(--perle);white-space:nowrap}
.mit-namen .ui-name{display:block}
.ui-status.puls .ui-ring{animation:ui-puls .7s ease}
@keyframes ui-puls{35%{transform:scale(1.18)}}
.ui-delta{position:absolute;left:50%;top:-6px;font:600 var(--t-klein) var(--f-zahl);pointer-events:none;white-space:nowrap;animation:ui-steigt 1.3s ease forwards}
.ui-delta.plus{color:var(--gut)}.ui-delta.minus{color:var(--schlecht)}
@keyframes ui-steigt{0%{opacity:0;transform:translate(-50%,6px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-20px)}}

/* Infokarte: immer gleich aufgebaut, schliesst per Klick daneben, Esc oder zweitem Klick */
.ui-infokarte{position:absolute;top:calc(100% + var(--a2));left:0;width:min(460px,calc(100vw - 40px));padding:var(--a2);border-radius:var(--r-karte);background:rgba(9,11,15,.95);border:1px solid var(--linie);box-shadow:0 18px 50px rgba(0,0,0,.35);z-index:6}
.ui-zeile{width:100%;display:grid;grid-template-columns:24px 1fr auto;gap:var(--a3);align-items:center;padding:var(--a2);border:0;border-radius:var(--r-taste);background:none;color:var(--perle);font:inherit;text-align:left;cursor:pointer}
.ui-zeile:hover{background:rgba(243,238,228,.06)}
.ui-zeile em{font-style:normal;color:var(--akz)}
.ui-zeile.niedrig em,.ui-zeile.niedrig .ui-ic{color:var(--schlecht)}
.ui-mehr{padding:0 var(--a2) var(--a3) calc(24px + var(--a3) + var(--a2))}
.ui-balken{height:6px;border-radius:var(--r-rund);background:rgba(243,238,228,.12);margin:0 0 var(--a2)}
.ui-balken i{display:block;height:100%;border-radius:var(--r-rund);background:var(--akz)}
.niedrig+.ui-mehr .ui-balken i{background:var(--schlecht)}
.ui-mehr p{margin:0;color:var(--perle-leise);font-size:var(--t-text);line-height:1.45}

/* Rueckmeldung bei jeder Wertaenderung: Puls, aufsteigende Zahl, kurz Name und Zustand */
.ui-wertmeldung{position:absolute;top:calc(100% + var(--a2));right:0;padding:var(--a1) var(--a3);border-radius:var(--r-rund);background:var(--rauch-stark);border:1px solid var(--linie);font-size:var(--t-klein);white-space:nowrap;pointer-events:none;animation:ui-meldung 2s ease forwards;z-index:6}
@keyframes ui-meldung{0%{opacity:0}12%{opacity:1}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  .ui-ring{transition:none}
  .ui-status.puls .ui-ring,.ui-delta{animation:none}
  .ui-delta{opacity:0}
  .ui-wertmeldung{animation:none}
}
</style>
<style>/* Eden: Bewegung und Uebergaenge (ui_stil.md Abschnitt 2b). Werte wie die Buehnenkarten: --szk-kurve, rein langsamer als raus. */
#bew-stufen{position:fixed;top:var(--a7);left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;align-items:center;gap:var(--a2);pointer-events:none}
.bew-stufe{--farbe:var(--akz2);display:flex;align-items:center;gap:var(--a4);padding:var(--a3) var(--a6) var(--a3) var(--a3);border-radius:var(--r-rund);border-color:var(--farbe);animation:bewStufeRein .55s cubic-bezier(.16,1,.3,1) both}
.bew-stufe.b{--farbe:var(--akz)}
.bew-stufe.geht{animation:bewStufeRaus .42s ease-in both}
.bew-ring{display:grid;place-items:center;width:var(--a7);height:var(--a7);border-radius:var(--r-rund);color:var(--farbe);background:rgba(243,238,228,.06);box-shadow:inset 0 0 0 2px var(--farbe);animation:bewRing .7s .2s cubic-bezier(.16,1,.3,1) both}
.bew-ring .ui-ic{width:30px;height:30px}
.bew-text{display:flex;flex-direction:column;gap:var(--a1)}
.bew-text b{font:750 var(--t-gross) var(--f-name);letter-spacing:-.01em;color:var(--perle)}
.bew-text > span{font-size:var(--t-info);color:var(--perle-leise)}
.bew-punkte{display:flex;gap:var(--a15);margin-top:var(--a1)}
.bew-punkte u{width:9px;height:9px;border-radius:var(--r-rund);background:rgba(243,238,228,.22);text-decoration:none}
.bew-punkte u.an{background:var(--farbe)}
.bew-punkte u.neu{animation:bewPop .6s .9s cubic-bezier(.16,1,.3,1) both;box-shadow:0 0 12px var(--farbe)}
.bew-pille{--farbe:var(--akz2);position:fixed;z-index:59;transform:translate(-50%,-50%);display:grid;place-items:center;width:var(--a7);height:var(--a7);border-radius:var(--r-rund);border-color:var(--farbe);color:var(--farbe);pointer-events:none;animation:bewFlug 1.3s cubic-bezier(.16,1,.3,1) both}
.bew-pille.b{--farbe:var(--akz)}
.bew-pille .ui-ic{width:28px;height:28px}
.bew-pille i{position:absolute;top:calc(var(--a1) * -1);right:calc(var(--a1) * -1);display:grid;place-items:center;width:var(--a45);height:var(--a45);border-radius:var(--r-rund);background:var(--farbe);color:var(--ink);font:700 var(--t-info) var(--f-zahl);font-style:normal}
#relkarte.bew-puls{animation:bewPuls .5s cubic-bezier(.16,1,.3,1)}
.bew-gewaehlt > *{transition:opacity .2s ease-in,filter .2s ease-in}
.bew-gewaehlt > *:not(.bew-wahl){opacity:.25;filter:saturate(.4)}
.bew-wahl{box-shadow:0 0 0 1px var(--akz),0 0 24px rgba(216,189,134,.45);transform:scale(1.02);transition:transform .15s ease-out,box-shadow .15s ease-out}
.bew-geist{pointer-events:none;transition:opacity .15s ease-out}
.bew-geist.aus{opacity:0}
@keyframes bewStufeRein{from{opacity:0;transform:translateY(-18px) scale(.96)}to{opacity:1;transform:none}}
@keyframes bewStufeRaus{to{opacity:0;transform:translateY(-10px)}}
@keyframes bewRing{from{transform:rotate(-90deg) scale(.7);opacity:0}to{transform:none;opacity:1}}
@keyframes bewPop{0%{transform:scale(.4)}60%{transform:scale(1.5)}100%{transform:scale(1)}}
@keyframes bewFlug{0%{opacity:0;transform:translate(-50%,-30%) scale(.8)}18%{opacity:1;transform:translate(-50%,-90%) scale(1)}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.6)}}
@keyframes bewPuls{40%{transform:scale(1.04);box-shadow:0 0 0 1px var(--akz)}}
@media (prefers-reduced-motion:reduce){.bew-stufe,.bew-stufe.geht,.bew-ring,.bew-punkte u.neu,.bew-pille,#relkarte.bew-puls{animation:none}.bew-wahl{transform:none}}
</style>

<script>// Gemeinsame Bausteine der Oberflaeche (Duc 30.10.2026, Regeln: docs/wiki/systeme/ui_stil.md).
// EdenUI.icon("name") = Icon aus dem Woerterbuch (werkzeuge/ui_icons.py), EdenUI.icon("name", "klein") = in Text und Pillen. EdenUI.status(box, werte, {spiel, namen}) = Status-Knoepfe
// mit Infokarte und Rueckmeldung. werte: [{key, label, kurz, wort, icon, wert, min, max, niedrig, info}].
window.EdenUI = (() => {
  const SPRITE = (window.EDEN_UI_SPRITE || "/plugins/eden-ui/icons.svg") + "?v=10";
  let quelle = SPRITE;        // bis der Sprite im Dokument liegt, sonst leer: Neuzeichnen laedt dann nichts nach und nichts blinkt
  document.addEventListener("DOMContentLoaded", async () => {
    try {
      const t = await (await fetch(SPRITE)).text();
      const h = document.createElement("div");
      h.style.cssText = "position:absolute;width:0;height:0;overflow:hidden";
      h.setAttribute("aria-hidden", "true");
      h.innerHTML = t;
      if (!h.querySelector("symbol")) return;
      document.body.prepend(h);
      quelle = "";
      document.querySelectorAll("use").forEach(u => { const a = u.getAttribute("href") || ""; if (a.includes("icons.svg")) u.setAttribute("href", a.slice(a.indexOf("#"))); });
    } catch (_) {}
  });
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
  const icon = (id, klasse = "") => `<svg class="ui-ic ${klasse}" aria-hidden="true"><use href="${quelle}#${esc(id)}"></use></svg>`;
  const anteil = w => w.max > w.min ? Math.round(100 * (w.wert - w.min) / (w.max - w.min)) : 0;
  const zustaende = new Set();

  function karteZeichnen(box, st){
    let k = box.querySelector(":scope > .ui-infokarte");
    if (!st.offen){ if (k) k.remove(); return; }
    if (!k){ k = document.createElement("div"); k.className = "ui-infokarte"; k.setAttribute("role", "dialog"); box.appendChild(k); }
    k.setAttribute("aria-label", "Status");
    k.innerHTML = st.werte.map(w => `<button type="button" class="ui-zeile${w.niedrig ? " niedrig" : ""}" data-k="${esc(w.key)}">${icon(w.icon)}<span>${esc(w.label)}</span><em>${esc(w.wort)}</em></button>
      ${st.offen === w.key ? `<div class="ui-mehr"><div class="ui-balken"><i style="width:${anteil(w)}%"></i></div><p>${esc(w.info)}</p></div>` : ""}`).join("");
  }
  function umschalten(box, st, key){
    st.offen = st.offen === key ? null : key;
    box.querySelectorAll(":scope > .ui-status").forEach(b => b.setAttribute("aria-expanded", String(st.offen === b.dataset.k)));
    karteZeichnen(box, st);
  }
  function melden(box, w, diff){
    const b = box.querySelector(`:scope > .ui-status[data-k="${w.key}"]`);
    if (!b) return;
    b.classList.remove("puls"); void b.offsetWidth; b.classList.add("puls");
    const z = document.createElement("span");
    z.className = "ui-delta " + (diff > 0 ? "plus" : "minus");
    z.textContent = (diff > 0 ? "+" : "−") + Math.abs(diff);
    z.addEventListener("animationend", () => z.remove());
    b.appendChild(z);
    box.querySelectorAll(":scope > .ui-wertmeldung").forEach(x => x.remove());
    const t = document.createElement("div");
    t.className = "ui-wertmeldung"; t.setAttribute("role", "status");
    t.textContent = `${w.label}: ${w.wort}`;
    box.appendChild(t);
    setTimeout(() => t.remove(), 2000);
  }
  function status(box, werte, opt = {}){
    let st = box._uiStatus;
    if (!st){
      st = box._uiStatus = {offen: null, vorher: {}, spiel: undefined, werte: []};
      zustaende.add({box, st});
      box.classList.add("ui-statusleiste");
      box.addEventListener("click", e => {
        const b = e.target.closest(".ui-status,.ui-zeile");
        if (!b) return;
        if (b.classList.contains("ui-zeile")) st.offen = null;      // Zeile der Karte: dieselbe Logik wie ein Knopf
        umschalten(box, st, b.dataset.k);
      });
    }
    const neuesSpiel = st.spiel !== opt.spiel;
    st.spiel = opt.spiel; st.werte = werte;
    box.classList.toggle("mit-namen", !!opt.namen);
    if (st.offen && !werte.some(w => w.key === st.offen)) st.offen = null;
    const reihe = werte.map(w => w.key).join();
    if (box.dataset.reihe !== reihe){
      box.querySelectorAll(":scope > .ui-status").forEach(b => b.remove());
      box.insertAdjacentHTML("afterbegin", werte.map(w => `<button type="button" class="ui-status" data-k="${esc(w.key)}"><span class="ui-ring"><svg class="ui-ic" aria-hidden="true"><use></use></svg></span><span class="ui-name"></span></button>`).join(""));
      box.dataset.reihe = reihe;
    }
    werte.forEach(w => {
      const b = box.querySelector(`:scope > .ui-status[data-k="${w.key}"]`);
      b.classList.toggle("niedrig", !!w.niedrig);
      b.title = w.label;
      b.setAttribute("aria-label", `${w.label}: ${w.wort}`);
      b.setAttribute("aria-expanded", String(st.offen === w.key));
      b.querySelector(".ui-ring").style.setProperty("--ui-p", anteil(w));
      b.querySelector("use").setAttribute("href", `${quelle}#${w.icon}`);
      b.querySelector(".ui-name").textContent = w.kurz || w.label;
      const alt = st.vorher[w.key];
      if (!neuesSpiel && alt !== undefined && alt !== w.wert) melden(box, w, w.wert - alt);
      st.vorher[w.key] = w.wert;
    });
    karteZeichnen(box, st);
  }
  function alleSchliessen(ausser){
    let zu = false;
    zustaende.forEach(({box, st}) => {
      if (st.offen && box !== ausser){ umschalten(box, st, null); zu = true; }
    });
    return zu;
  }
  document.addEventListener("click", e => {
    const pfad = e.composedPath();                   // nicht contains: das Neuzeichnen kann das Ziel schon entfernt haben
    alleSchliessen([...zustaende].map(z => z.box).find(b => pfad.includes(b)));
  });
  // Vor dem Spiel-Handler (Esc = Menue): Eine offene Karte schliesst zuerst.
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && alleSchliessen()){ e.preventDefault(); e.stopImmediatePropagation(); }
  }, true);
  window.uiIc = icon;        // fuer alle Plugins: uiIc("name", "klein" oder "imtext")
  // Emoji aus Servertexten werden an dieser einen Stelle zu Icons. Der Handy-Chat bleibt, dort tippen die Figuren selbst.
  const EMOJI = {"📱": "phone", "📞": "phone", "🎣": "fish", "🐟": "fish", "🌿": "leaf", "🍳": "cooking", "🛏": "bunk", "🔎": "investigate", "🔍": "investigate", "📜": "rule",
    "🎒": "backpack", "🚩": "travel", "🔥": "burn", "⚔": "fight", "🗡": "fight", "🪓": "axe", "⛏": "pick", "🔨": "pick", "★": "quality", "⚖": "confront", "⚠": "warning",
    "🎁": "gift", "⚡": "energy", "🤝": "trade", "💬": "talk", "🗣": "talk", "🧸": "charm", "👂": "listen", "💔": "dislike", "📌": "secure", "💭": "memory", "📅": "calendar",
    "✓": "done", "✔": "done", "✕": "failed", "✗": "failed", "⏳": "deadline", "⏱": "time", "⏰": "time", "🎭": "gag", "♥": "love", "♡": "love", "📣": "order", "🧩": "compare",
    "😵": "stunned", "🏃": "dodge", "🎶": "music", "🛡": "guard"};
  const EMOJI_RE = new RegExp(Object.keys(EMOJI).join("|"), "u");
  const EMOJI_ALLE = new RegExp("(" + Object.keys(EMOJI).join("|") + ")️?", "gu");
  const NICHT = "script,style,textarea,input,svg,.geraet";
  function emojiErsetzen(wurzel){
    const lauf = document.createTreeWalker(wurzel, NodeFilter.SHOW_TEXT), treffer = [];
    while (lauf.nextNode()) if (EMOJI_RE.test(lauf.currentNode.nodeValue) && !lauf.currentNode.parentElement?.closest(NICHT)) treffer.push(lauf.currentNode);
    treffer.forEach(k => {
      const f = document.createElement("template");
      f.innerHTML = esc(k.nodeValue).replace(EMOJI_ALLE, (_, e) => icon(EMOJI[e], "imtext"));
      k.replaceWith(f.content);
    });
  }
  let wartet = false;
  const beobachter = new MutationObserver(() => {
    if (wartet) return;
    wartet = true;
    queueMicrotask(() => { wartet = false; if (document.body) emojiErsetzen(document.body); });
  });
  document.addEventListener("DOMContentLoaded", () => { emojiErsetzen(document.body); beobachter.observe(document.body, {childList: true, subtree: true, characterData: true}); });
  return {icon, status, emojiErsetzen};
})();
</script>
<script>/* Eden: Bewegung und Uebergaenge (Duc 02.11.2026, docs/wiki/systeme/ui_stil.md Abschnitt 2b).
   Vier Mikro-Interaktionen im Stil der Buehnenkarten, alles ohne Eingriff in die Spiellogik:
   1. Stufe steigt: kurze Karte oben mit Ring, Pop und Klang (Vertrauen/Begehren je Figur).
   2. Wert steigt im Gespraech: kleine Pille steigt von der Figur auf und fliegt zur Beziehungskarte.
   3. Antwort gewaehlt: die Wahl bleibt kurz stehen und leuchtet, die anderen blenden aus, dann erst wird gesendet.
   4. Gefuehl wechselt: der Sprite blendet in 150 ms ueber statt hart zu springen.
   Bei "weniger Bewegung" (prefers-reduced-motion) gibt es nur die Information, ohne Animation. */
(function () {
  "use strict";
  const still = () => !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
  let vorher = null, lauf = null;

  function schnappschuss(z) {
    const out = {};
    (z.werte || []).forEach(w => { out[w.id] = {name: w.name, vertrauen: w.vertrauen, begehren: w.begehren, va: w.v_anteil, ba: w.b_anteil}; });
    return out;
  }

  // Trust = Smiley in Blau, Desire = Herz in Gold, wie die Punkte der Beziehungskarte (Duc 02.11.2026: keine technischen Etiketten)
  const IC = {vertrauen: "mood-good", begehren: "love"};
  const SATZ = {vertrauen: "trusts you more", begehren: "wants you more"};
  const icon = (achse, klasse) => window.EdenUI ? EdenUI.icon(IC[achse], klasse) : "";

  // 1. Stufe steigt
  function stufenKarte(name, achse, stufe) {
    let ebene = document.getElementById("bew-stufen");
    if (!ebene) { ebene = document.createElement("div"); ebene.id = "bew-stufen"; document.body.appendChild(ebene); }
    const k = document.createElement("div");
    k.className = "bew-stufe glas " + (achse === "begehren" ? "b" : "v");
    const punkte = [1, 2, 3, 4, 5].map(n => `<u class="${n < stufe ? "an" : n === stufe ? "an neu" : ""}"></u>`).join("");
    k.innerHTML = `<span class="bew-ring">${icon(achse, "")}</span><span class="bew-text"><b>${name}</b>`
      + `<span>${SATZ[achse]}</span><span class="bew-punkte">${punkte}</span></span>`;
    ebene.appendChild(k);
    if (window.EdenSfx) EdenSfx.play("level_up");
    setTimeout(() => k.classList.add("geht"), still() ? 2200 : 2800);
    setTimeout(() => k.remove(), 3400);
  }

  // 2. Wert steigt im Gespraech
  function pilleFliegt(pid, achse) {
    const fig = document.getElementById("fig-" + pid), ziel = document.getElementById("relkarte");
    if (!fig || !ziel || still()) return;
    const a = fig.getBoundingClientRect(), b = ziel.getBoundingClientRect();
    if (!a.width || !b.width) return;
    const p = document.createElement("div");
    p.className = "bew-pille glas " + (achse === "begehren" ? "b" : "v");
    p.innerHTML = icon(achse, "") + "<i>+</i>";
    const x0 = a.left + a.width / 2, y0 = a.top + a.height * 0.28;
    p.style.left = x0 + "px"; p.style.top = y0 + "px";
    p.style.setProperty("--dx", (b.left + b.width / 2 - x0) + "px");
    p.style.setProperty("--dy", (b.top + b.height / 2 - y0) + "px");
    document.body.appendChild(p);
    setTimeout(() => { p.remove(); ziel.classList.remove("bew-puls"); void ziel.offsetWidth; ziel.classList.add("bew-puls"); }, 1300);
  }

  function observe(V) {
    const z = V && V.z;
    if (!z || !z.werte) { vorher = null; return; }
    const jetzt = schnappschuss(z), alt = vorher, gleicherLauf = lauf === z.id;
    vorher = jetzt; lauf = z.id;
    if (!alt || !gleicherLauf) return;
    const buehne = new Set(z.status === "szene" && z.szene ? z.szene.buehne.map(f => f.id) : []);
    Object.entries(jetzt).forEach(([pid, w]) => {
      const v = alt[pid];
      if (!v) return;
      [["vertrauen", "va"], ["begehren", "ba"]].forEach(([achse, anteil]) => {
        if (w[achse] > v[achse]) stufenKarte(w.name, achse, w[achse]);
        else if (buehne.has(pid) && w[achse] === v[achse] && (w[anteil] || 0) > (v[anteil] || 0)) pilleFliegt(pid, achse);
      });
    });
  }

  // 3. Antwort gewaehlt: Klick abfangen, Wahl zeigen, dann den echten Klick ausloesen
  const WAHL = ".wahlb, #chips .chip, .ev-opt, .option";
  document.addEventListener("click", ev => {
    const knopf = ev.target.closest && ev.target.closest(WAHL);
    if (!knopf || knopf.disabled || knopf.dataset.bewOk || still()) return;
    if (knopf.closest("#chips") && !knopf.closest("#chips").querySelector(".chip:nth-child(2)")) return;   // nur "Ideas": nichts zu waehlen
    ev.preventDefault(); ev.stopImmediatePropagation();
    const gruppe = knopf.parentElement;
    gruppe.classList.add("bew-gewaehlt");
    knopf.classList.add("bew-wahl");
    setTimeout(() => { knopf.dataset.bewOk = "1"; knopf.click(); delete knopf.dataset.bewOk; gruppe.classList.remove("bew-gewaehlt"); knopf.classList.remove("bew-wahl"); }, 260);
  }, true);

  // 4. Gefuehl wechselt: altes Bild als Geist darueber, der ausblendet
  function figurBeobachten() {
    const box = document.getElementById("figuren");
    if (!box) return;
    new MutationObserver(liste => liste.forEach(m => {
      const img = m.target;
      if (m.attributeName !== "src" || !m.oldValue || m.oldValue === img.getAttribute("src") || still() || img.classList.contains("weg")) return;
      const geist = img.cloneNode(false);
      geist.removeAttribute("id");
      geist.src = m.oldValue;
      geist.classList.add("bew-geist");
      img.parentElement.appendChild(geist);
      requestAnimationFrame(() => requestAnimationFrame(() => geist.classList.add("aus")));
      setTimeout(() => geist.remove(), 260);
    })).observe(box, {subtree: true, attributes: true, attributeFilter: ["src"], attributeOldValue: true});
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", figurBeobachten); else figurBeobachten();

  window.EdenBewegung = {observe};
})();
</script>
<script>
const SPR = {"neutral": "file:///X:/AI/SillyTavern3/SillyTavern-Launcher/SillyTavern/data/default-user/characters/Rosi%20Scuderi/neutral.png", "joy": "file:///X:/AI/SillyTavern3/SillyTavern-Launcher/SillyTavern/data/default-user/characters/Rosi%20Scuderi/joy.png", "amusement": "file:///X:/AI/SillyTavern3/SillyTavern-Launcher/SillyTavern/data/default-user/characters/Rosi%20Scuderi/amusement.png", "desire": "file:///X:/AI/SillyTavern3/SillyTavern-Launcher/SillyTavern/data/default-user/characters/Rosi%20Scuderi/desire.png"}, GEF = ["neutral", "joy", "amusement", "desire"];
let w = {id: "rosi", name: "Rosi", vertrauen: 2, begehren: 1, v_anteil: 20, b_anteil: 10}, g = 0;
const V = () => ({z: {id: "showcase", status: "szene", szene: {buehne: [{id: "rosi"}]}, werte: [Object.assign({}, w)]}});
const log = t => document.getElementById("log").textContent = t;
const karte = () => { document.getElementById("rv").textContent = w.vertrauen; document.getElementById("rb").textContent = w.begehren; };
EdenBewegung.observe(V());
function wertSteigt(a){ const k = a === "begehren" ? "b_anteil" : "v_anteil"; w[k] = (w[k] + 20) % 100 || 20; EdenBewegung.observe(V()); log(a === "begehren" ? "Desire ↗ (Punkte, keine neue Stufe)" : "Trust ↗ (Punkte, keine neue Stufe)"); }
function stufe(a){ w[a] = w[a] >= 5 ? 1 : w[a] + 1; w[a === "begehren" ? "b_anteil" : "v_anteil"] = 0; EdenBewegung.observe(V()); karte(); log((a === "begehren" ? "Desire" : "Trust") + " Stufe " + w[a]); }
function gefuehl(){ g = (g + 1) % GEF.length; document.getElementById("fig-rosi").src = SPR[GEF[g]]; log("Gefühl: " + GEF[g]); }
function antworten(){
  const tx = ["“I'll stay. Nothing's broken, I just like it here.”", "“Tell me about the bank, Rosi.”", "“You've got oil on your nose. It suits you.”"];
  const box = document.getElementById("wahlmoment");
  box.innerHTML = tx.map((t, i) => `<button class="wahlb" type="button" onclick="gewaehlt(${i})"><kbd>${i + 1}</kbd><span>${t}</span></button>`).join("");
  log("Wähle rechts unten eine Antwort.");
}
function gewaehlt(i){ document.getElementById("wahlmoment").innerHTML = ""; log("Gesendet: Antwort " + (i + 1)); }
const warte = ms => new Promise(r => setTimeout(r, ms));
async function vorfuehrung(){
  const b = document.getElementById("auto"); b.disabled = true;
  wertSteigt("vertrauen"); await warte(1800);
  wertSteigt("begehren"); await warte(1800);
  gefuehl(); await warte(900); gefuehl(); await warte(1200);
  stufe("vertrauen"); await warte(3400);
  antworten(); await warte(1200);
  document.querySelector("#wahlmoment .wahlb:nth-child(1)").click(); await warte(1400);
  stufe("begehren"); await warte(3400);
  b.disabled = false; log("Vorführung fertig.");
}
</script>
